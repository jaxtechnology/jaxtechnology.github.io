<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiki's Contract Detective - Reading, Math, and Fair Deals</title>
<style>
  :root {
    --k:#000; --b:#0000aa; --g:#00aa00; --n:#aa5500; --l:#aaaaaa; --d:#555555;
    --B:#5555ff; --G:#55ff55; --C:#55ffff; --R:#ff5555; --M:#ff55ff; --Y:#ffff55; --W:#ffffff;
    --mono: "Courier New", Courier, "Lucida Console", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #000;
    color: var(--W);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.4;
  }
  a { color: var(--C); }
  a:hover { color: var(--Y); }
  :focus-visible { outline: 3px solid var(--Y); outline-offset: 2px; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 14px 14px 40px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 12px; font-size: 16px; }
  .snd {
    font: inherit; font-size: 16px; color: var(--Y); background: #000; cursor: pointer;
    border: 2px solid var(--W); padding: 6px 14px; min-height: 44px;
  }
  .snd:hover, .snd:focus-visible { background: var(--W); color: #000; outline: none; }
  .snd[aria-pressed="true"] { color: var(--G); }
  .snd[aria-pressed="true"]:hover, .snd[aria-pressed="true"]:focus-visible { color: #006600; }

  .frame { border: 4px solid var(--W); box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--B); background: #000; }
  .screen { position: relative; border-bottom: 4px solid var(--W); }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; background: #000; }

  #hud {
    display: flex; flex-wrap: wrap; gap: 4px 22px;
    padding: 8px 18px; font-size: 15px;
    border-bottom: 2px dotted var(--d);
  }
  #hud[hidden] { display: none; }
  #hud .lbl { color: var(--l); }
  #hud .low { color: var(--R); }

  #text { padding: 16px 18px 12px; outline: none; }
  #text p { margin: 0 0 .75em; max-width: 64ch; }
  h1.title {
    margin: 4px 0 6px; font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: .05em;
    color: var(--Y); text-shadow: 4px 4px 0 var(--R), 8px 8px 0 var(--B);
  }
  h2 { margin: 0 0 .6em; font-size: 20px; letter-spacing: .04em; color: var(--Y); }
  .sub { color: var(--C); margin-top: .9em !important; }
  .gold { color: var(--Y); }
  .good { color: var(--G); }
  .bad  { color: var(--R); }
  .hint { color: var(--C); }
  .q    { color: var(--W); background: var(--b); padding: 6px 10px; }
  .fx   { font-size: 16px; }
  .fx span { margin-right: 18px; }
  .board { white-space: pre-wrap; border: 2px solid var(--d); padding: 8px 12px; max-width: 46ch; }
  .steps { margin: 0 0 .75em; padding-left: 1.6em; max-width: 64ch; }
  .steps li { margin: .45em 0; }

  #choices { padding: 0 10px 18px; }
  .choice {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; color: var(--W); background: transparent;
    border: 0; padding: 8px 8px; margin: 2px 0; min-height: 44px;
  }
  .choice .n { color: var(--Y); }
  .choice:hover, .choice:focus-visible { background: var(--W); color: #000; outline: none; }
  .choice:hover .n, .choice:focus-visible .n { color: #aa0000; }

  .foot { margin-top: 18px; font-size: 14px; color: var(--l); max-width: 64ch; }

  @media (max-width: 520px) {
    body { font-size: 16px; }
    #text { padding: 12px 12px 8px; }
    #choices { padding: 0 4px 14px; }
    #hud { padding: 8px 12px; font-size: 13px; }
  }

  .who { color: var(--C); }
  .who::after { content: ":"; }
</style>
</head>
<body>
<div class="wrap">
  <p class="top"><a href="https://jaxtechnology.github.io/">Back to Jax Technology</a>
    <button id="snd" class="snd" type="button" aria-pressed="false">Sound: Off</button></p>

  <div class="frame">
    <div class="screen"><canvas id="screen" width="320" height="160" aria-hidden="true"></canvas></div>
    <div id="hud" hidden></div>
    <div id="text" tabindex="-1" aria-live="polite"></div>
    <div id="choices" role="group" aria-label="Your choices"></div>
  </div>

  <p class="foot">Kiki's Contract Detective is a classroom game about reading closely, checking math, and making fair deals. Click a choice, or press its number key. Press M to turn sound on or off. The music and sounds are made right in your browser.</p>
</div>

  function kiki(x, y, pose, s) {
    var g = KIKI[pose] || KIKI.stand;
    for (var j = 0; j < g.length; j++) {
      var row = g[j], i = 0;
      while (i < row.length) {
        var ch = row.charAt(i);
        if (ch === '.') { i++; continue; }
        var k = i; while (k < row.length && row.charAt(k) === ch) k++;
        R(x + i * s, y + j * s, (k - i) * s, s, KIKI_PAL[ch]);
        i = k;
      }
    }
  }

  // Digits and decimal points, any scale.

  // One multiple-choice question. opts: [{t, ok}]. cfg.onWrong overrides the default mistake handling.
  function askOne(cfg, next) {
    var opts = cfg.fixed ? cfg.opts : shuffle(cfg.opts.slice());
    var ch = opts.map(function (o) {
      return { label: o.t, run: function () {
        if (o.ok) { sfx('correct', 0.08); render({ scene: cfg.scene, pose: 'cheer', title: cfg.title, body: ['<p class="good">CORRECT!</p>', say(cfg.right)], choices: [{ label: 'Continue', run: next }] }); }
        else if (cfg.onWrong) cfg.onWrong(cfg, next);
        else { M.mistakes++; sfx('wrong', 0.08); render({ scene: cfg.scene, pose: 'stand', title: cfg.title, body: ['<p class="bad">NOT QUITE.</p>', say(cfg.wrong)], choices: [{ label: 'Continue', run: next }] }); }
      } };

    if (cfg.hintFn) ch.push(cfg.hintFn);
    render({ scene: cfg.scene, pose: 'stand', title: cfg.title,
      body: [cfg.lead ? say(cfg.lead) : '', '<p class="q">' + cfg.q + '</p>', cfg.extra || ''], choices: ch });
  }

  // qs: [{ q, ok, bad:[...], right, wrong }]

    var k = 0;

      var q = qs[k++];
      askOne({ scene: scene, title: title + ' (' + k + ' of ' + qs.length + ')', lead: 'Quick check! Pick the best answer.', q: q.q,
               opts: [{ t: q.ok, ok: true }].concat(q.bad.map(function (b) { return { t: b, ok: false }; })), right: q.right, wrong: q.wrong }, step);
    })();
  }

      return { label: o.t, run: function () {
        var go = function () { M.k++; M.hint = 0; M.optsD = null; if (M.k >= DATES5.length) m5Done(); else m5Ask(); };
        if (o.ok) { sfx('correct', 0.08); render({ scene: 'calendar', pose: 'cheer', title: 'ON TIME!', body: ['<p class="good">CORRECT!</p>', say(d.why)], choices: [{ label: 'Continue', run: go }] }); }
        else m5Late(d, go);
      } };
    });
    ch.push(hintBtn(m5Ask));
    render({ scene: 'calendar', pose: 'magnify', title: 'MEET THE DEADLINE (' + (M.k + 1) + ' OF ' + DATES5.length + ')',
      body: [say('Count carefully.'), '<p class="q">' + d.q + '</p>', '<p class="board">LATE STAMPS: ' + M.late + ' OF 3</p>', hintLine(d.hints)], choices: ch });
  }
  function m5Done() {
    M.mistakes = [0, 2, 4][M.late]; M.cal = null;
    finishMission();
  }

  /* =========================================================
     MISSION 6: FAIR DEAL
     ========================================================= */
  var DEALS6 = [
    { s: 'The school wants a lower price. Sunridge wants a bigger order. What is a fair deal?', ok: 'Lower the price by 10% if the school orders 50 boxes instead of 30', bad: ['Keep the price the same no matter what', 'Cut the price in half for no reason'],
      right: 'The school saves money, and Sunridge sells more. Both sides get something.', wrong: 'The fair deal gives each side something: the school gets a lower price, and Sunridge gets a bigger order.' },
    { s: 'The soccer club wants all the uniforms by Friday. Sunridge needs a few extra days. What is a fair deal?', ok: 'Deliver half by Friday and the rest the next Wednesday', bad: ['Promise Friday even though it is impossible', 'Deliver whenever, with no promise'],
      right: 'The club gets some uniforms on time, and Sunridge gets the time it needs. Plus it is honest.', wrong: 'Deliver half by Friday and the rest the next Wednesday. It is honest and gives both sides something.' },
    { s: 'A bakery wants to pay in 60 days. Sunridge wants payment in 15 days. What is a fair deal?', ok: 'Meet in the middle: payment in 30 days', bad: ['Pay in 60 days, no questions', 'Pay today or there is no deal'],
      right: 'Each side moves a little. That is called a compromise.', wrong: 'Meet in the middle at 30 days. When each side moves a little, it is called a compromise.' },
    { s: 'You notice a typo in a contract that would give your company an extra 100 dollars. What do you do?', ok: 'Tell the other side and fix it with an amendment', bad: ['Say nothing and keep the extra money', 'Change it quietly without telling them'],
      right: 'Honesty builds trust, and trust is the most valuable thing in business.', wrong: 'Tell the other side and fix it with an amendment. Being honest, even when a mistake would help you, builds trust.' }
  ];

  function m6() {
    newMission(5);
    M.bal = 0;
    info({ scene: 'deal', pose: 'stand', title: 'MISSION 6: FAIR DEAL',
      body: [say('The best contracts are <b class="gold">fair</b> to both sides. Usually each side wants something different. A good deal finds a <b class="gold">compromise</b>, where both sides give a little and get something they care about.'),
             '<p class="board">Both sides get something.\nBe honest.\nNo tricks, and no one-sided deals.</p>'],
      next: function () { M.k = 0; m6Ask(); } });
  }
  function m6Ask() {
    var dl = DEALS6[M.k];
    askOne({ scene: 'deal', title: 'FIND THE FAIR DEAL (' + (M.k + 1) + ' OF ' + DEALS6.length + ')', lead: '', q: dl.s,
             opts: [{ t: dl.ok, ok: true }].concat(dl.bad.map(function (b) { return { t: b, ok: false }; })), right: dl.right, wrong: dl.wrong,
             onWrong: function (cfg, next) {
               M.mistakes++; sfx('wrong', 0.08); M.bal = 1;
               render({ scene: 'deal', pose: 'stand', title: cfg.title, body: ['<p class="bad">NOT QUITE.</p>', say(cfg.wrong), '<span class="hint">The scale tips when a deal favors only one side.</span>'], choices: [{ label: 'Continue', run: function () { M.bal = 0; next(); } }] });
             } },
           function () { M.bal = 0; M.k++; if (M.k >= DEALS6.length) m6Quiz(); else m6Ask(); });
  }
  function m6Quiz() {
    quizSeq('deal', 'DEAL CHECK', [
      { q: 'What makes a deal fair?', ok: 'Both sides get something they care about', bad: ['Only the bigger company wins', 'The first offer is always accepted', 'Nobody reads the contract'],
        right: 'Yes! A fair deal works for both sides.', wrong: 'Both sides get something they care about. That is what makes a deal fair.' },
      { q: 'What is a compromise?', ok: 'Each side gives a little to reach an agreement', bad: ['One side gives up everything', 'Nobody agrees', 'A type of contract page'],
        right: 'Correct! Meeting in the middle is the heart of a good deal.', wrong: 'A compromise is when each side gives a little to reach an agreement.' }
    ], finishMission);
  }

  /* =========================================================
     HUB, NOTEBOOK, GRADUATION, TITLE
     ========================================================= */
  var RUNNERS = [m1, m2, m3, m4, m5, m6];

  function hub() {
    M = null; PROG.started = true;
    var all = PROG.done.every(Boolean), any = PROG.done.some(Boolean);
    var ch = MISSIONS.map(function (m, i) {
      return { label: '<b>' + (i + 1) + '. ' + m.name + '</b> - ' + m.blurb + (PROG.done[i] ? ' <span class="gold">' + starText(PROG.stars[i]) + '</span>' : ''), run: RUNNERS[i] };
    });
    ch.push({ label: 'Open my case notebook', run: notebook });
    if (all) ch.push({ label: '<span class="gold">Graduation day!</span>', run: finale });
    render({ scene: 'hub', pose: 'stand', title: 'THE CONTRACT OFFICE',
      body: [say(any ? 'Welcome back to the office, detective! Pick a case. Any order works, but the order shown is the best way to learn.' : 'Welcome to the contract office! I am Kiki. Pick a case to start. Case 1 is a great place to begin.'),
             PROG.stamped ? say('A contract is still stamped LATE from last time. Want to clear it with Mission 5?') : '',
             '<span class="hint">Finish all 6 missions to graduate. Stars: 3 for few mistakes, so take your time.</span>'],
      choices: ch });
  }

  function notebook() {
    var any = PROG.done.some(Boolean);
    render({ scene: 'hub', pose: 'stand', title: 'CASE NOTEBOOK',
      body: [say(any ? 'Here is everything you have learned so far:' : 'Your notebook is empty. Finish a mission and I will write down what you learned.'),
             any ? '<p class="board">' + NOTES.filter(function (n, i) { return PROG.done[i]; }).join('\n\n') + '</p>' : ''],
      choices: [{ label: 'Back to the office', run: hub }, { label: 'Erase my progress', run: erase }] });
  }
  function erase() {
    render({ scene: 'hub', pose: 'stand', title: 'ERASE PROGRESS?',
      body: [say('This clears all your stars and your notebook. Are you sure?')],
      choices: [{ label: 'Keep my progress', run: notebook },
                { label: 'Yes, erase everything', run: function () { PROG.stars = [0, 0, 0, 0, 0, 0]; PROG.done = [false, false, false, false, false, false]; PROG.stamped = false; saveP(); hub(); } }] });
  }

  function finale() {
    var tot = totalStars(), rank = tot >= 16 ? 'SENIOR CONTRACT ANALYST' : tot >= 12 ? 'CONTRACT ANALYST' : 'JUNIOR ANALYST';
    sfx('pass'); sfx('coin', 0.4);
    render({ scene: 'win', title: 'GRADUATION DAY!',
      body: [say('You solved every case! You read closely, spotted problems, checked the math, kept the dates, and found fair deals, just like a real analyst.'),
             '<p class="board">CERTIFICATE OF CONTRACT SKILL\nCASES SOLVED: 6 OF 6\nSTARS: ' + tot + ' OF 18\nRANK: <span class="gold">' + rank + '</span></p>',
             '<span class="hint">Want more stars? Go back and retry any mission for a better score.</span>'],
      choices: [{ label: 'Back to the office', run: hub }] });
  }

  function title() {
    render({ scene: 'title', big: 'KIKI\'S CONTRACT DETECTIVE',
      body: ['<p class="hint" style="margin-top:0">Read closely. Spot the problems. Make it fair.</p>',
             'Meet Kiki, a contract analyst at Sunridge Supply Co., a company that sells supplies to schools and businesses. Help her read contracts, hunt for tricky fine print, check invoices, count deadlines, and find fair deals. Kiki explains everything, and hints are always one press away.'],
      choices: [
        { label: 'Enter the office', run: hub },
        { label: 'How to play', run: function () {
            render({ scene: 'hub', pose: 'stand', title: 'HOW TO PLAY',
              body: [say('It is easy! Here is how my office works:'),
                     '<p class="board">Click a choice, or press its number key.\nStuck? Choose "Ask Kiki for a hint" as many times as you like.\nEarn up to 3 stars per mission. Fewer mistakes means more stars.\nYour progress saves on this computer.\nPress M to turn sound on or off.</p>'],
              choices: [{ label: 'Back', run: title }] });
          } }
      ] });
  }

  /* ---------- sound button ---------- */
  var sndBtn = $('snd');
  function sndLabel() {
    sndBtn.textContent = 'Sound: ' + (Snd.on ? 'On' : 'Off');
    sndBtn.setAttribute('aria-pressed', Snd.on ? 'true' : 'false');
  }
  try { Snd.on = localStorage.getItem('roadToLawSound') === '1'; } catch (e) { /* ignore */ }
  sndLabel();
  sndBtn.addEventListener('click', function () { Snd.set(!Snd.on); });
  function unlockAudio() {
    if (Snd.on && !Snd.ctx && Snd.init()) { Snd.ctx.resume(); Snd.cur = null; Snd.play(Snd.want); }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', function () {
    if (!Snd.ctx) return;
    if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume();
  });

  loadP();
  title();
})();
</script>
</body>
</html>
