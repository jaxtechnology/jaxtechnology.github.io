<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jax Technology - Classroom Tools</title>
<style>
  :root {
    --bg1: #fff4d6;
    --bg2: #d6f0ff;
    --card-bg: #ffffff;
    --text: #2b2b3a;
    --text-soft: #5a5a6b;
    --accent1: #ff6b6b;
    --shadow: rgba(0,0,0,0.15);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #201f36;
      --bg2: #1b2a3d;
      --card-bg: #2a2a43;
      --text: #f4f4fb;
      --text-soft: #cfcfe0;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Comic Sans MS", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg1), var(--bg2));
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 16px 60px;
  }
  header { text-align: center; margin-bottom: 30px; }
  h1 {
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    margin: 8px 0 4px;
    color: var(--accent1);
    text-shadow: 2px 2px 0 var(--shadow);
  }
  .subtitle { color: var(--text-soft); font-size: 1.1rem; margin: 0; }

  /*
    ---------------------------------------------------------
    TO ADD A NEW TOOL: copy one <a class="tool-card"> block
    below (inside #toolGrid), change the href, emoji, title
    and description, and paste it back in. That's it.
    ---------------------------------------------------------
  */
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 24px;
  }
  .tool-card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px 18px;
    text-align: center;
    box-shadow: 0 8px 0 var(--shadow);
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: transform .12s ease;
  }
  .tool-card:hover { transform: translateY(-4px) scale(1.02); }
  .tool-card:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--shadow); }
  .tool-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
  .tool-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 4px; }
  .tool-desc { font-size: 0.95rem; color: var(--text-soft); }

  footer {
    text-align: center;
    margin-top: 50px;
    color: var(--text-soft);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🖥️ Jax Technology</h1>
    <p class="subtitle">Classroom tools and activities</p>
  </header>

  <div class="tool-grid" id="toolGrid">

    <a class="tool-card" href="/mouse/">
      <span class="tool-emoji">🖱️</span>
      <div class="tool-title">Mouse Practice</div>
      <div class="tool-desc">Click, drag, scroll, and select practice games</div>
    </a>

    <!-- Add new tool cards here, copying the block above -->

  </div>

  <footer>Mr. Sandlin's Technology Classroom</footer>
</div>
</body>
</html>
