<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miss Sarah's Piano Studio - Music Skills</title>
<style>
  :root {
    --k:#000; --b:#0000aa; --g:#00aa00; --n:#aa5500; --l:#aaaaaa; --d:#555555;
    --B:#5555ff; --G:#55ff55; --C:#55ffff; --R:#ff5555; --M:#ff55ff; --Y:#ffff55; --W:#ffffff;
    --mono: "Courier New", Courier, "Lucida Console", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #000;
    color: var(--W);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.4;
  }
  a { color: var(--C); }
  a:hover { color: var(--Y); }
  :focus-visible { outline: 3px solid var(--Y); outline-offset: 2px; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 14px 14px 40px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 12px; font-size: 16px; }
  .snd {
    font: inherit; font-size: 16px; color: var(--Y); background: #000; cursor: pointer;
    border: 2px solid var(--W); padding: 6px 14px; min-height: 44px;
  }
  .snd:hover, .snd:focus-visible { background: var(--W); color: #000; outline: none; }
  .snd[aria-pressed="true"] { color: var(--G); }
  .snd[aria-pressed="true"]:hover, .snd[aria-pressed="true"]:focus-visible { color: #006600; }

  .frame { border: 4px solid var(--W); box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--B); background: #000; }
  .screen { position: relative; border-bottom: 4px solid var(--W); }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; background: #000; }

  #hud {
    display: flex; flex-wrap: wrap; gap: 4px 22px;
    padding: 8px 18px; font-size: 15px;
    border-bottom: 2px dotted var(--d);
  }
  #hud[hidden] { display: none; }
  #hud .lbl { color: var(--l); }
  #hud .low { color: var(--R); }

  #text { padding: 16px 18px 12px; outline: none; }
  #text p { margin: 0 0 .75em; max-width: 64ch; }
  h1.title {
    margin: 4px 0 6px; font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: .05em;
    color: var(--Y); text-shadow: 4px 4px 0 var(--R), 8px 8px 0 var(--B);
  }
  h2 { margin: 0 0 .6em; font-size: 20px; letter-spacing: .04em; color: var(--Y); }
  .sub { color: var(--C); margin-top: .9em !important; }
  .gold { color: var(--Y); }
  .good { color: var(--G); }
  .bad  { color: var(--R); }
  .hint { color: var(--C); }
  .q    { color: var(--W); background: var(--b); padding: 6px 10px; }
  .fx   { font-size: 16px; }
  .fx span { margin-right: 18px; }
  .board { white-space: pre-wrap; border: 2px solid var(--d); padding: 8px 12px; max-width: 46ch; }
  .steps { margin: 0 0 .75em; padding-left: 1.6em; max-width: 64ch; }
  .steps li { margin: .45em 0; }

  #choices { padding: 0 10px 18px; }
  .choice {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; color: var(--W); background: transparent;
    border: 0; padding: 8px 8px; margin: 2px 0; min-height: 44px;
  }
  .choice .n { color: var(--Y); }
  .choice:hover, .choice:focus-visible { background: var(--W); color: #000; outline: none; }
  .choice:hover .n, .choice:focus-visible .n { color: #aa0000; }

  .foot { margin-top: 18px; font-size: 14px; color: var(--l); max-width: 64ch; }

  @media (max-width: 520px) {
    body { font-size: 16px; }
    #text { padding: 12px 12px 8px; }
    #choices { padding: 0 4px 14px; }
    #hud { padding: 8px 12px; font-size: 13px; }
  }

  .who { color: var(--C); }
  .who::after { content: ":"; }
</style>
</head>
<body>
<div class="wrap">
  <p class="top"><a href="https://jaxtechnology.github.io/">Back to Jax Technology</a>
    <button id="snd" class="snd" type="button" aria-pressed="false">Sound: Off</button></p>

  <div class="frame">
    <div class="screen"><canvas id="screen" width="320" height="160" aria-hidden="true"></canvas></div>
    <div id="hud" hidden></div>
    <div id="text" tabindex="-1" aria-live="polite"></div>
    <div id="choices" role="group" aria-label="Your choices"></div>
  </div>

  <p class="foot">Miss Sarah's Piano Studio is a classroom game about reading and playing music. Click a choice, or press its number key. Press M to turn sound on or off. The music and sounds are made right in your browser.</p>
</div>

<noscript><p style="padding:20px">This game needs JavaScript turned on.</p></noscript>

    });
    ch.push({ label: 'Watch it again', run: function () { m5Watch(); } });
    ch.push({ label: M.letters ? 'Hide the letters' : 'Show the letters (a hint)', run: function () { M.letters = !M.letters; m5Input(); } });
    render({ scene: 'memory', pose: 'stand', title: 'YOUR TURN (ROUND ' + (M.round + 1) + ' OF 4)',
      body: [say('Press the notes in the same order. Note ' + (M.pos + 1) + ' of ' + M.pat.length + '.'), '<p class="board">SOUR NOTES: ' + M.strikes + ' OF 3</p>',
             M.letters ? '<span class="hint">The pattern: ' + M.pat.map(function (k) { return NOTE_LETTERS[k]; }).join(' - ') + '</span>' : ''],
      choices: ch });
  }
  function m5Sour(played) {
    M.strikes++; sfx('wrong');
    if (M.strikes >= 3) { m5Fail(); return; }
    render({ scene: 'memory', pose: 'oops', title: 'SOUR NOTE!',
      body: ['<p class="bad">THUNK! That note was ' + NOTE_LETTERS[played] + ', and the piano slips out of tune.</p>', '<p class="board">SOUR NOTES: ' + M.strikes + ' OF 3</p>', say('The right note was <b class="gold">' + NOTE_LETTERS[M.pat[M.pos]] + '</b>. Let us watch the pattern again.')],
      choices: [{ label: 'Watch again', run: m5Watch }] });
  }
  function m5Fail() {
    PROG.flag = true; saveP(); sfx('fail', 0.25);
    render({ scene: 'memory', pose: 'oops', title: 'OUT OF TUNE',
      body: ['<p class="bad">THUNK! That was the third sour note.</p>',
             say('Oh no, the piano is out of tune! Do not worry, every musician hits sour notes. Check your notebook, and we will retune the piano and try again.')],
      choices: [
        { label: 'Retune the piano and try again', run: function () { PROG.flag = false; saveP(); M.strikes = 0; M.round = 0; m5Round(); } },
        { label: 'Back to the studio', run: hub }
      ] });
  }
  function m5Done() { M.watch++; M.lit = null; M.mistakes = [0, 2, 4][M.strikes]; finishMission(); }

  /* ---------- Mission 6: Musical Words ---------- */
  var TERMS6 = [
    { w: 'piano (soft)', ok: 'Soft', bad: ['Loud', 'Fast', 'Slow'], why: '"Piano" is Italian for soft. It is also the name of the instrument, which can play softly or loudly.' },
    { w: 'forte (loud)', ok: 'Loud', bad: ['Soft', 'Smooth', 'Short'], why: '"Forte" is Italian for strong, and in music it means loud.' },
    { w: 'allegro', ok: 'Fast and lively', bad: ['Slow and calm', 'Very soft', 'Gradually louder'], why: '"Allegro" means fast and lively. It means "cheerful" in Italian.' },
    { w: 'andante', ok: 'A walking pace', bad: ['Very fast', 'Very loud', 'A pause'], why: '"Andante" comes from the Italian for walking. It is a steady, moderate speed.' },
    { w: 'crescendo', ok: 'Gradually getting louder', bad: ['Suddenly stopping', 'Getting slower', 'Getting softer'], why: '"Crescendo" means growing. The music gets gradually louder.' },
    { w: 'staccato', ok: 'Short and detached', bad: ['Smooth and connected', 'Very loud', 'Very slow'], why: '"Staccato" means each note is short and separate, like little pops.' },
    { w: 'legato', ok: 'Smooth and connected', bad: ['Short and detached', 'Very fast', 'Very soft'], why: '"Legato" means smooth, with the notes connected like a flowing line.' },
    { w: 'ritardando', ok: 'Gradually slowing down', bad: ['Gradually speeding up', 'Getting louder', 'Stopping'], why: '"Ritardando" means gradually slowing down, which is often used near the end of a piece.' }
  ];
  function m6() {
    newMission(5);
    info({ scene: 'words', pose: 'stand', title: 'MISSION 6: MUSICAL WORDS',
      body: [say('Musicians around the world use <b class="gold">Italian words</b> to describe how to play. When you read them, you know exactly how a piece should sound.'),
             '<p class="board">PIANO = soft, FORTE = loud.\nALLEGRO = fast, ANDANTE = a walking pace.\nCRESCENDO = gradually louder.\nSTACCATO = short, LEGATO = smooth.</p>'],
      next: function () { M.order = shuffle([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, 6); M.k = 0; M.hint = 0; M.optsW = null; m6Ask(); } });
  }
  function m6Ask() {
    var d = TERMS6[M.order[M.k]];
    if (!M.optsW || M.optsWk !== M.k) { M.optsW = shuffle([{ t: d.ok, ok: true }].concat(d.bad.map(function (b) { return { t: b, ok: false }; }))); M.optsWk = M.k; }
    var ch = M.optsW.map(function (o) {
      return { label: o.t, run: function () {
        if (o.ok) sfx('correct'); else { M.mistakes++; sfx('wrong'); }
        render({ scene: 'words', pose: o.ok ? 'cheer' : 'stand', title: o.ok ? 'CORRECT!' : 'NOT QUITE', body: [say((o.ok ? '' : 'The answer is: <b class="gold">' + d.ok.toLowerCase() + '</b>. ') + d.why)],
          choices: [{ label: 'Continue', run: function () { M.k++; M.hint = 0; M.optsW = null; if (M.k >= M.order.length) m6Quiz(); else m6Ask(); } }] });
      } };
    });
    ch.push(hintBtn(m6Ask));
    render({ scene: 'words', pose: 'stand', title: 'WHAT DOES IT MEAN? (' + (M.k + 1) + ' OF ' + M.order.length + ')',
      body: [say('A music book says <b class="gold">' + d.w.split(' (')[0] + '</b>. What does it tell you to do?'),
             hintLine(['Think about the sound: loud, soft, fast, slow, short, or smooth.', 'Does the word sound like something you know in English?', 'The answer is: ' + d.ok.toLowerCase() + '.'])],
      choices: ch });
  }
  function m6Quiz() {
    quizSeq('words', 'WORDS CHECK', [
      { q: 'Which word tells you to play LOUDLY?', ok: 'Forte', bad: ['Piano', 'Legato', 'Andante'], right: 'Yes! Forte means loud.', wrong: 'Forte. Forte means loud, and piano means soft.' },
      { q: 'What does a crescendo tell you to do?', ok: 'Gradually get louder', bad: ['Stop playing', 'Play very short notes', 'Slow down'], right: 'Correct! The music grows louder, step by step.', wrong: 'Gradually get louder. A crescendo grows, like a wave building.' }
    ], finishMission);
  }


  /* ---------- Free play piano ---------- */
  var KEYMAP = { z: 'w0', x: 'w1', c: 'w2', v: 'w3', b: 'w4', n: 'w5', m: 'w6', q: 'w7', w: 'w8', e: 'w9', r: 'w10', t: 'w11', y: 'w12', u: 'w13', i: 'w14',
                 s: 'b0', d: 'b1', g: 'b3', h: 'b4', j: 'b5', '2': 'b7', '3': 'b8', '5': 'b10', '6': 'b11', '7': 'b12' };
  function fpStatus() {
    var el = $('fpstat'); if (!el) return;
    var s = FP.rec ? 'Recording... ' + FP.events.length + ' notes' : (FP.events.length ? 'Your recording has ' + FP.events.length + ' notes.' : 'Press any key to play!');
    if (FP.song) s += '   Song helper: play the GREEN key. Note ' + (FP.pos + 1) + ' of ' + SONGS[FP.song - 1].notes.length + '.';
    el.textContent = s;
  }
  function fpPress(black, i) {
    if (!FP.active) return;
    if (black && !hasBlack(i)) return;
    var name = noteName(i, black);
    playNote(name, 1.4);
    FP.down[(black ? 'b' : 'w') + i] = performance.now();
    if (FP.rec) FP.events.push({ n: name, b: black, i: i, t: performance.now() - FP.t0 });
    if (FP.song && !black) {
      var s = SONGS[FP.song - 1];
      if (i === s.notes[FP.pos]) { FP.pos++; if (FP.pos >= s.notes.length) { FP.pos = 0; sfx('pass', 0.3); FP.status = 'You played the whole song!'; } }
    }
    draw(); fpStatus();
  }
  function fpHit(x, y) {
    if (y >= KY && y <= KY + BH) { for (var j = 0; j < WK - 1; j++) if (hasBlack(j) && x >= KX + j * KW + KW - 6 && x <= KX + j * KW + KW - 6 + BW) return { b: true, i: j }; }
    if (y >= KY && y <= KY + KH) { var i = Math.floor((x - KX) / KW); if (i >= 0 && i < WK) return { b: false, i: i }; }
    return null;
  }
  cv.addEventListener('pointerdown', function (e) {
    if (!FP.active || view.name !== 'free') return;
    var r = cv.getBoundingClientRect(), k = fpHit((e.clientX - r.left) * 320 / r.width, (e.clientY - r.top) * 160 / r.height);
    if (k) { fpPress(k.b, k.i); e.preventDefault(); }
  });
  document.addEventListener('keydown', function (e) {
    if (!FP.active || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = KEYMAP[String(e.key).toLowerCase()];
    if (k) { fpPress(k.charAt(0) === 'b', parseInt(k.slice(1), 10)); e.preventDefault(); }
  });
  function fpPlayback() {
    if (!FP.events.length) return;
    var token = ++FP.playing;
    FP.events.forEach(function (ev) {
      setTimeout(function () { if (FP.playing !== token || !FP.active) return; playNote(ev.n, 1.2); FP.down[(ev.b ? 'b' : 'w') + ev.i] = performance.now(); draw(); }, ev.t);
    });
  }
  function freePlay() {
    FP.active = true; KEYLOCK = true; FP.pos = 0;
    if (!Snd.on) Snd.set(true);
    renderFree();
  }
  function renderFree() {
    render({ scene: 'free', pose: 'stand', title: 'FREE PLAY PIANO',
      body: [say('This is your piano! Play anything you like. Click or tap the keys, or use your computer keyboard.'),
             '<p class="board">WHITE KEYS: bottom row Z X C V B N M, then top row Q W E R T Y U I\nBLACK KEYS: S D G H J, then 2 3 5 6 7</p>',
             '<p id="fpstat" class="hint"></p>'],
      choices: [
        { label: 'Note names: ' + (FP.names ? 'ON (click to hide)' : 'OFF (click to show)'), run: function () { FP.names = !FP.names; renderFree(); } },
        { label: FP.rec ? '<span class="bad">Stop recording</span>' : 'Record', run: function () { if (!FP.rec) { FP.events = []; FP.t0 = performance.now(); FP.rec = true; } else FP.rec = false; renderFree(); } },
        { label: 'Play my recording', run: function () { fpPlayback(); fpStatus(); } },
        { label: 'Song helper: ' + (FP.song ? SONGS[FP.song - 1].name : 'OFF') + ' (click to change)', run: function () { FP.song = (FP.song + 1) % (SONGS.length + 1); FP.pos = 0; renderFree(); } },
        { label: 'Back to the studio', run: function () { FP.active = false; FP.rec = false; FP.playing++; KEYLOCK = false; hub(); } }
      ] });
    fpStatus();
  }

  var RUNNERS = [m1, m2, m3, m4, m5, m6];
  var GAME = {
    big: 'MISS SARAH\'S PIANO STUDIO', tagline: 'Learn the keys. Read the notes. Make music!', enter: 'Enter the studio',
    intro: 'Meet Miss Sarah, a piano teacher with a studio full of music. Learn the keys, read the staff, count the rhythm, build scales, test your musical memory, and learn the words musicians use, and then play whatever you like on the free-play piano. Miss Sarah explains everything, and hints are always one press away.',
    soundLine: '<p class="hint">Sound is ON so you can hear the piano. Use the Sound button, or press M, to turn it off.</p>',
    titleExtra: [{ label: 'Play a test note', run: function () { if (!Snd.on) Snd.set(true); setTimeout(function () { playNote('C4', 1.2); playNote('E4', 1.2); playNote('G4', 1.2); }, 60); } }],
    hubExtra: [{ label: '<b>Free play piano</b> - play anything you like!', run: freePlay }],
    hubTitle: 'THE PIANO STUDIO', back: 'the studio', nb: 'MUSIC NOTEBOOK', nbShort: 'music notebook',
    welcomeFirst: 'Welcome to my piano studio! I am Miss Sarah. Pick a lesson to start. Lesson 1 is a great place to begin.',
    welcomeBack: 'Welcome back to the studio! Pick a lesson. Any order works, but the order shown is the best way to learn.',
    flagMsg: 'The piano is still out of tune from last time. Want to retune it with Mission 5?',
    cert: 'CERTIFICATE OF MUSICAL SKILL',
    gradSay: 'You finished every lesson! You know the keys, read the staff, count the rhythm, build scales, play by ear, and speak the language of music.',
    rank: function (tot) { return tot >= 16 ? 'PIANO PRODIGY' : tot >= 12 ? 'MUSICIAN' : 'MUSIC STUDENT'; }
  };

  /* =========================================================
     HUB, NOTEBOOK, GRADUATION, TITLE
     ========================================================= */
  function hub() {
    M = null; PROG.started = true;
    var all = PROG.done.every(Boolean), any = PROG.done.some(Boolean);
    var ch = MISSIONS.map(function (m, i) {
      return { label: '<b>' + (i + 1) + '. ' + m.name + '</b> - ' + m.blurb + (PROG.done[i] ? ' <span class="gold">' + starText(PROG.stars[i]) + '</span>' : ''), run: RUNNERS[i] };
    });
    (GAME.hubExtra || []).forEach(function (e) { ch.push(e); });
    ch.push({ label: 'Open my ' + GAME.nbShort, run: notebook });
    if (all) ch.push({ label: '<span class="gold">Graduation day!</span>', run: finale });
    render({ scene: 'hub', pose: 'stand', title: GAME.hubTitle,
      body: [say(any ? GAME.welcomeBack : GAME.welcomeFirst), PROG.flag ? say(GAME.flagMsg) : '',
             '<span class="hint">' + (GAME.hubHint || 'Finish all 6 missions to graduate. Stars: 3 for few mistakes, so take your time.') + '</span>'],
      choices: ch });
  }

  function notebook() {
    var any = PROG.done.some(Boolean);
    render({ scene: 'hub', pose: 'stand', title: GAME.nb,
      body: [say(any ? 'Here is everything you have learned so far:' : 'Your notebook is empty. Finish a mission and I will write down what you learned.'),
             any ? '<p class="board">' + NOTES.filter(function (n, i) { return PROG.done[i]; }).join('\n\n') + '</p>' : ''],
      choices: [{ label: 'Back to ' + GAME.back, run: hub }, { label: 'Erase my progress', run: erase }] });
  }
  function erase() {
    render({ scene: 'hub', pose: 'stand', title: 'ERASE PROGRESS?',
      body: [say('This clears all your stars and your notebook. Are you sure?')],
      choices: [{ label: 'Keep my progress', run: notebook },
                { label: 'Yes, erase everything', run: function () { PROG.stars = [0, 0, 0, 0, 0, 0]; PROG.done = [false, false, false, false, false, false]; PROG.flag = false; saveP(); hub(); } }] });
  }

  function finale() {
    var tot = totalStars(), rank = GAME.rank(tot);
    sfx('pass'); sfx('coin', 0.4);
    render({ scene: 'win', title: 'GRADUATION DAY!',
      body: [say(GAME.gradSay),
             '<p class="board">' + GAME.cert + '\n' + (GAME.certMissions || 'MISSIONS: 6 OF 6') + '\nSTARS: ' + tot + ' OF 18\nRANK: <span class="gold">' + rank + '</span></p>',
             '<span class="hint">Want more stars? Go back and retry any mission for a better score.</span>'],
      choices: [{ label: 'Back to ' + GAME.back, run: hub }] });
  }

  function title() {
    render({ scene: 'title', big: GAME.big,
      body: ['<p class="hint" style="margin-top:0">' + GAME.tagline + '</p>', GAME.intro, GAME.soundLine || ''],
      choices: [
        { label: GAME.enter, run: hub }].concat(GAME.titleExtra || []).concat([
        { label: 'How to play', run: function () {
            render({ scene: 'hub', pose: 'stand', title: 'HOW TO PLAY',
              body: [say('It is easy! Here is how it works:'),
                     '<p class="board">Click a choice, or press its number key.\nStuck? Choose "Ask Sarah for a hint" as many times as you like.\nEarn up to 3 stars per mission. Fewer mistakes means more stars.\nYour progress saves on this computer.\nPress M to turn sound on or off.</p>'],
              choices: [{ label: 'Back', run: title }] });
          } }
      ]) });
  }

  /* ---------- sound button ---------- */
  var sndBtn = $('snd');
  function sndLabel() {
    sndBtn.textContent = 'Sound: ' + (Snd.on ? 'On' : 'Off');
    sndBtn.setAttribute('aria-pressed', Snd.on ? 'true' : 'false');
  }
  try { var savedSnd = localStorage.getItem('sarahPianoSound'); Snd.on = savedSnd === null ? true : savedSnd === '1'; } catch (e) { Snd.on = true; }
  sndLabel();
  sndBtn.addEventListener('click', function () { Snd.set(!Snd.on); });
  function unlockAudio() {
    if (Snd.on && !Snd.ctx && Snd.init()) { Snd.ctx.resume(); Snd.cur = null; Snd.play(Snd.want); }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', function () {
    if (!Snd.ctx) return;
    if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume();
  });

  loadP();
  title();
})();
</script>
</body>
</html>
