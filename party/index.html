<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ari's Party Rush</title>
<style>
  :root { --pink: #ff6fa5; --ink: #4a2f3b; --sun: #ffc93c; --sky: #5aa9ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(#ffe3ef, #ffd0e2); background-attachment: fixed; color: var(--ink);
         font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
  .app { max-width: 1000px; margin: 0 auto; padding: 12px 14px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .top a { color: #b02e68; font-weight: 700; }
  .pill { font: inherit; font-weight: 800; border: 0; border-radius: 999px; padding: 8px 16px; background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 #e8b6cb; }
  .pill[aria-pressed="true"] { background: #d7f7e0; box-shadow: 0 3px 0 #9bd8b0; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .stage { border-radius: 20px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 10px 28px rgba(140, 40, 90, 0.28); background: #fff0f6; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: manipulation; cursor: pointer; }
  .panel { background: #fff; border-radius: 20px; margin-top: 14px; padding: 18px 22px 20px; box-shadow: 0 8px 22px rgba(140, 40, 90, 0.16); outline: none; }
  h1 { margin: 0 0 6px; font-size: clamp(30px, 6vw, 46px); color: var(--pink); letter-spacing: -0.01em; }
  h2 { margin: 0 0 8px; font-size: 28px; color: #d04a86; }
  p { margin: 0 0 10px; } .lead { font-size: 18px; max-width: 60ch; } .sm { color: #7a6572; font-size: 15px; }
  .good { color: #1f9a4a; font-weight: 800; } .bad { color: #d6403a; font-weight: 800; } .gold { color: #e0a000; }
  .q { background: #fff2c4; border-radius: 14px; padding: 12px 16px; font-weight: 700; font-size: 19px; }
  .board { background: #fff7fb; border: 3px solid #ffd0e3; border-radius: 14px; padding: 10px 14px; line-height: 1.7; }
  .note { background: #eef9ff; border-left: 6px solid var(--sky); border-radius: 0 12px 12px 0; padding: 10px 14px; }
  .tip { color: #7a6572; }
  .steps li { margin-bottom: 8px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 4px 0; margin-top: 8px; }
  .btn { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 11px 18px; margin: 4px 10px 6px 0; background: var(--pink); color: #fff; cursor: pointer; box-shadow: 0 5px 0 #c8467c; text-align: left; }
  .btn:hover { filter: brightness(1.06); } .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c8467c; }
  .btn.alt { background: var(--sky); box-shadow: 0 5px 0 #3b7fcc; } .btn.ghost { background: #efe6ea; color: var(--ink); box-shadow: 0 5px 0 #cdbfc6; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .num { display: inline-block; min-width: 22px; margin-right: 8px; padding: 0 6px; border-radius: 8px; background: rgba(0, 0, 0, 0.18); text-align: center; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 10px 0 6px; }
  .card { font: inherit; text-align: left; border-radius: 18px; border: 3px solid #ffd0e3; background: #fff7fb; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; position: relative; color: var(--ink); box-shadow: 0 5px 0 #f1bdd3; }
  .card:hover { background: #fff; } .card b { font-size: 20px; } .card .cn { position: absolute; right: 12px; top: 8px; font-size: 28px; font-weight: 800; color: #f6bdd5; }
  .card .st { color: #e0a000; font-size: 20px; letter-spacing: 2px; } .card .sm { font-size: 14px; }
  .card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.6); }
  .up { background: #fff7fb; border: 3px solid #ffd0e3; border-radius: 14px; padding: 10px 14px; margin: 8px 0; } .pips { color: #e0a000; letter-spacing: 3px; }
  @media (max-width: 560px) { body { font-size: 16px; } .panel { padding: 14px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><a href="https://jaxtechnology.github.io/">Back to Jax Technology</a><button id="snd" class="pill" type="button" aria-pressed="false">Sound: Off</button></div>
  <div class="stage"><canvas id="cv" width="960" height="540" aria-label="The party floor"></canvas></div>
  <section id="panel" class="panel" tabindex="-1" aria-live="polite"></section>
</div>
<script>
(function () {
  'use strict';
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  /* AUDIO START */
  var NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freqOf(n) {
    var m = /^([A-G])(#?)(\d)$/.exec(n);
    var midi = 12 * (Number(m[3]) + 1) + NOTE_BASE[m[1]] + (m[2] ? 1 : 0);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  function parseSeq(str) {
    var ev = [], pos = 0;
    str.trim().split(/\s+/).forEach(function (tok) {
      var p = tok.split(':'), d = Number(p[1]);
      if (p[0] !== '-') ev.push({ at: pos, f: freqOf(p[0]), d: d });
      pos += d;
    });
    return { events: ev, len: pos };
  }
  function mkChan(str) {
    var q = parseSeq(str), map = {};
    q.events.forEach(function (e) { map[e.at] = e; });
    return { map: map, len: q.len };
  }
  function mkTrack(d) {
    var tr = { sd: 60 / d.tempo / 4, loop: d.loop !== false, lead: mkChan(d.lead), harm: mkChan(d.harm), bass: mkChan(d.bass), drums: d.drums || '' };
    tr.len = tr.lead.len;
    return tr;
  }

  var TRACKS = {
    // Bouncy party title theme (C major)
    title: mkTrack({ tempo: 138,
      lead: 'C5:2 C5:2 E5:2 G5:2 C6:4 G5:2 E5:2  D5:2 D5:2 F5:2 A5:2 D6:4 A5:2 F5:2  E5:2 E5:2 G5:2 B5:2 E6:4 B5:2 G5:2  C6:4 G5:4 E5:4 C5:4',
      harm: 'C4:4 E4:4 G4:4 E4:4  D4:4 F4:4 A4:4 F4:4  E4:4 G4:4 B4:4 G4:4  C4:4 E4:4 G4:4 C5:4',
      bass: 'C3:2 -:2 G2:2 -:2 C3:2 -:2 G2:2 -:2  D3:2 -:2 A2:2 -:2 D3:2 -:2 A2:2 -:2  E3:2 -:2 B2:2 -:2 E3:2 -:2 B2:2 -:2  C3:4 G2:4 C3:8',
      drums: 'k.h.s.h.k.h.s.hh' + 'k.h.s.h.k.h.s.hh' + 'k.h.s.h.k.h.s.hh' + 'k.h.s.h.k.k.ssss' }),
    // Cheerful planning loop (C major)
    party: mkTrack({ tempo: 120,
      lead: 'E5:2 -:2 E5:2 -:2 G5:4 E5:2 C5:2  D5:2 -:2 D5:2 -:2 F5:4 D5:2 B4:2  E5:2 -:2 E5:2 -:2 G5:4 A5:2 G5:2  F5:4 E5:4 C5:8',
      harm: 'C4:2 G4:2 C5:2 G4:2 C4:2 G4:2 C5:2 G4:2  G3:2 D4:2 G4:2 D4:2 G3:2 D4:2 G4:2 D4:2  C4:2 G4:2 C5:2 G4:2 C4:2 G4:2 C5:2 G4:2  F3:4 G3:4 C4:8',
      bass: 'C3:4 -:4 C3:4 -:4  G2:4 -:4 G2:4 -:4  C3:4 -:4 C3:4 -:4  F2:4 G2:4 C3:8',
      drums: 'k.h.s.h.k.h.s.h.' + 'k.h.s.h.k.h.s.h.' + 'k.h.s.h.k.h.s.h.' + 'k.h.s.h.k.h.s.h.' }),
    win: mkTrack({ tempo: 140, loop: false,
      lead: 'E5:2 G5:2 C6:2 E6:4 C6:2 E6:4  G6:4 F6:2 E6:2 C6:8',
      harm: 'C4:2 E4:2 G4:2 C5:4 G4:2 C5:4  E4:4 D4:2 C4:2 C4:8',
      bass: 'C3:4 G2:4 C3:4 G2:4  C3:4 G2:4 C3:8',
      drums: 'k.h.s.h.k.h.s.hh' + 'k.k.s.s.kkkkssss' })
  };

  function audioCheck() {
    var bad = [];
    Object.keys(TRACKS).forEach(function (k) {
      var t = TRACKS[k];
      if (t.harm.len !== t.len) bad.push(k + ': harmony length ' + t.harm.len + ' vs ' + t.len);
      if (t.bass.len !== t.len) bad.push(k + ': bass length ' + t.bass.len + ' vs ' + t.len);
      if (t.drums.length && t.drums.length !== t.len) bad.push(k + ': drums length ' + t.drums.length + ' vs ' + t.len);
    });
    return bad;
  }

  var Snd = { ctx: null, master: null, bus: null, on: false, want: 'title', cur: null, tr: null, step: 0, next: 0, timer: null, noise: null, p25: null, p50: null };

  function pulseWave(ctx, duty) {
    var n = 32, re = new Float32Array(n + 1), im = new Float32Array(n + 1);
    for (var k = 1; k <= n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return ctx.createPeriodicWave(re, im);
  }

  Snd.init = function () {
    if (this.ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 1;
      this.master.connect(this.ctx.destination);
      var sr = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, sr, sr), d = buf.getChannelData(0);
      for (var i = 0; i < sr; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.p25 = pulseWave(this.ctx, 0.25);
      this.p50 = pulseWave(this.ctx, 0.5);
    } catch (e) { this.ctx = null; return false; }
    return true;
  };

  Snd.note = function (dest, kind, f, when, dur, vol, slideTo) {
    var c = this.ctx, o = c.createOscillator(), g = c.createGain();
    if (kind === 'p25') o.setPeriodicWave(this.p25);
    else if (kind === 'p50') o.setPeriodicWave(this.p50);
    else o.type = kind === 'saw' ? 'sawtooth' : 'triangle';
    o.frequency.setValueAtTime(f, when);
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.006);
    g.gain.setValueAtTime(vol, when + Math.max(0.01, dur - 0.03));
    g.gain.linearRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(dest);
    o.start(when); o.stop(when + dur + 0.02);
  };

  Snd.drum = function (kind, when) {
    var c = this.ctx, g = c.createGain();
    if (kind === 'k') {
      var o = c.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, when);
      o.frequency.exponentialRampToValueAtTime(45, when + 0.09);
      g.gain.setValueAtTime(0.2, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.11);
      o.connect(g); g.connect(this.bus);
      o.start(when); o.stop(when + 0.13);
      return;
    }
    var src = c.createBufferSource(), f = c.createBiquadFilter(), dur = kind === 's' ? 0.1 : 0.035;
    src.buffer = this.noise;
    f.type = kind === 's' ? 'bandpass' : 'highpass';
    f.frequency.value = kind === 's' ? 1800 : 6500;
    g.gain.setValueAtTime(kind === 's' ? 0.07 : 0.035, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    src.connect(f); f.connect(g); g.connect(this.bus);
    src.start(when, Math.random() * 0.5, dur + 0.02);
  };

  Snd.playStep = function (tr, i, when) {
    var e = tr.lead.map[i];
    if (e) this.note(this.bus, 'p25', e.f, when, e.d * tr.sd * 0.92, 0.085);
    e = tr.harm.map[i];
    if (e) this.note(this.bus, 'p50', e.f, when, e.d * tr.sd * 0.85, 0.04);
    e = tr.bass.map[i];
    if (e) this.note(this.bus, 'tri', e.f, when, e.d * tr.sd * 0.95, 0.12);
    var d = tr.drums.charAt(i);
    if (d === 'k' || d === 's' || d === 'h') this.drum(d, when);
  };

  Snd.tick = function () {
    var c = this.ctx, tr = this.tr;
    if (!c || !tr) return;
    while (this.next < c.currentTime + 0.15) {
      this.playStep(tr, this.step, this.next);
      this.next += tr.sd;
      this.step++;
      if (this.step >= tr.len) {
        if (tr.loop) this.step = 0;
        else { clearInterval(this.timer); this.timer = null; this.tr = null; return; }
      }
    }
  };

  Snd.fadeBus = function () {
    var old = this.bus;
    if (!old) return;
    var now = this.ctx.currentTime;
    try {
      old.gain.cancelScheduledValues(now);
      old.gain.setValueAtTime(old.gain.value, now);
      old.gain.linearRampToValueAtTime(0, now + 0.08);
    } catch (e) { /* ignore */ }
    setTimeout(function () { try { old.disconnect(); } catch (e) { /* ignore */ } }, 250);
    this.bus = null;
  };

  Snd.play = function (key) {
    this.want = key;
    if (!this.on || !this.ctx || this.cur === key) return;
    this.cur = key;
    clearInterval(this.timer);
    this.fadeBus();
    this.bus = this.ctx.createGain();
    this.bus.connect(this.master);
    this.tr = TRACKS[key];
    this.step = 0;
    this.next = this.ctx.currentTime + 0.08;
    var me = this;
    this.timer = setInterval(function () { me.tick(); }, 30);
  };

  Snd.halt = function () {
    clearInterval(this.timer); this.timer = null; this.tr = null; this.cur = null;
    if (this.ctx) this.fadeBus();
  };

  Snd.set = function (v) {
    if (v && !this.init()) return;
    this.on = v;
    try { localStorage.setItem('ariRushSound', v ? '1' : '0'); } catch (e) { /* ignore */ }
    if (v) { this.ctx.resume(); this.cur = null; this.play(this.want); sfx('blip'); }
    else this.halt();
    sndLabel();
  };

  var SFX = {
    blip:    function (S0) { Snd.note(Snd.master, 'p50', 660, S0, 0.05, 0.09); },
    correct: function (S0) { Snd.note(Snd.master, 'p50', 784, S0, 0.09, 0.1); Snd.note(Snd.master, 'p50', 1047, S0 + 0.09, 0.18, 0.1); },
    wrong:   function (S0) { Snd.note(Snd.master, 'saw', 196, S0, 0.14, 0.06); Snd.note(Snd.master, 'saw', 147, S0 + 0.13, 0.28, 0.06); },
    pass:    function (S0) { [523, 659, 784, 1047].forEach(function (f, i) { Snd.note(Snd.master, 'p25', f, S0 + i * 0.08, i === 3 ? 0.25 : 0.09, 0.09); }); },
    fail:    function (S0) { [392, 330, 262].forEach(function (f, i) { Snd.note(Snd.master, 'p50', f, S0 + i * 0.13, i === 2 ? 0.3 : 0.12, 0.09); }); },
    gavel:   function (S0) {
      Snd.note(Snd.master, 'tri', 130, S0, 0.07, 0.25, 70);
      var c = Snd.ctx, src = c.createBufferSource(), g = c.createGain();
      src.buffer = Snd.noise; g.gain.setValueAtTime(0.12, S0); g.gain.exponentialRampToValueAtTime(0.001, S0 + 0.06);
      src.connect(g); g.connect(Snd.master); src.start(S0, 0.2, 0.08);
    },
    stamp:   function (S0) { Snd.note(Snd.master, 'tri', 110, S0, 0.2, 0.3, 45); Snd.note(Snd.master, 'saw', 98, S0, 0.2, 0.04, 60); }
  };

  function sfx(name, delay) {
    if (!Snd.on || !Snd.ctx || !SFX[name]) return;
    try { SFX[name](Snd.ctx.currentTime + (delay || 0)); } catch (e) { /* ignore */ }
  }

  /* AUDIO END */
  // Extra sounds: a balloon pop and a coin ping.
  SFX.pop = function (S0) {
    var c = Snd.ctx, src = c.createBufferSource(), g = c.createGain();
    src.buffer = Snd.noise; g.gain.setValueAtTime(0.35, S0); g.gain.exponentialRampToValueAtTime(0.001, S0 + 0.08);
    src.connect(g); g.connect(Snd.master); src.start(S0, 0.4, 0.1);
    Snd.note(Snd.master, 'p25', 700, S0, 0.05, 0.1, 180);
  };
  SFX.coin = function (S0) {
    Snd.note(Snd.master, 'p50', 988, S0, 0.07, 0.09);
    Snd.note(Snd.master, 'p50', 1319, S0 + 0.07, 0.22, 0.09);
  };

  /* =========================================================
     ART: smooth cartoon drawing for the party floor
     ========================================================= */
  var W = 960, H = 540, FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';
  var c = cx;                                   // the context the helpers draw on (swapped while building the cached background)

  function rr(x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function box(x, y, w, h, r, fill, stroke, lw) { rr(x, y, w, h, r); c.fillStyle = fill; c.fill(); if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.stroke(); } }
  function oval(x, y, rx, ry, fill, stroke, lw) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.stroke(); } }
  function grad(x0, y0, x1, y1, a, b) { var g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
  function mix(a, b, t) {
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16), r = [];
    [16, 8, 0].forEach(function (s) { r.push(Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t)); });
    return 'rgb(' + r.join(',') + ')';
  }
  function text(s, x, y, size, fill, align, stroke) {
    c.font = 'bold ' + size + 'px ' + FONT; c.textAlign = align || 'left'; c.textBaseline = 'middle';
    if (stroke) { c.lineWidth = Math.max(3, size / 5); c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(s, x, y); }
    c.fillStyle = fill; c.fillText(s, x, y);
  }
  function heart(x, y, s, fill) {
    c.beginPath(); c.moveTo(x, y + s * 0.3);
    c.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    c.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.72, x, y + s);
    c.bezierCurveTo(x, y + s * 0.72, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    c.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3); c.closePath();
    c.fillStyle = fill; c.fill(); c.lineWidth = 1.6; c.strokeStyle = 'rgba(60,20,40,0.7)'; c.stroke();
  }
  function star5(x, y, r, fill) {
    c.beginPath(); for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    c.closePath(); c.fillStyle = fill; c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(80,50,0,0.6)'; c.stroke();
  }

  var INK = '#4a2f3b';
  var SKIN = ['#f6d3b3', '#e8b98a', '#c98f62', '#9a6743', '#6b4430'], HAIRC = ['#2b1d12', '#5a3b22', '#8a5a2b', '#d9a441', '#b5402a', '#3b3b46'];
  var SHIRTC = ['#ff7b7b', '#6fa8ff', '#6fd08c', '#ffd45e', '#c78cff', '#ff9f5a', '#5ed3d3', '#f58bc2'], HATC = ['#ff6fa5', '#ffc93c', '#5aa9ff', '#7ed957', '#c78cff', '#ff9f5a'];

  /* ---------- treats ---------- */
  function drawItem(kind, x, y, s) {
    c.save(); c.translate(x, y); c.scale(s / 30, s / 30);
    if (kind === 'pizza') {
      c.beginPath(); c.moveTo(-14, -10); c.lineTo(14, -10); c.lineTo(0, 15); c.closePath(); c.fillStyle = '#ffcf4a'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#9a5b12'; c.stroke();
      box(-15, -13, 30, 6, 3, '#e0a83a', '#9a5b12', 2); oval(-3, -2, 3.6, 3.6, '#e0453a'); oval(5, -4, 3.2, 3.2, '#e0453a'); oval(0, 6, 3, 3, '#e0453a');
    } else if (kind === 'cake') {
      box(-13, -2, 26, 15, 4, '#fff4f8', INK, 2); box(-13, -2, 26, 6, 3, '#ff7ba8', INK, 2); box(-1.5, -12, 3, 10, 1, '#5aa9ff'); oval(0, -14, 2.6, 3.6, '#ffc93c');

    if (!G || G.over || G.paused || !G.waiting.some(function (w) { return w.id === id; })) return;
    G.selected = G.selected === id ? null : id; sfx('blip');
  }
  function actCounter(tid) {
    var g = G; if (!g || g.over || g.paused) return;
    var rd = g.kitchen.ready.filter(function (d) { return d.tid === tid; })[0]; if (!rd) return;
    queueTask(g, { type: 'pickup', tid: tid, slot: rd.slot, dur: 0.35 });
  }
  function actTable(id) {
    var g = G; if (!g || g.over || g.paused) return;
    var tb = g.tables[id], gr = tb.group;
    if (tb.state === 'empty') {
      if (g.selected == null) return;
      var sel = null; g.waiting.forEach(function (w) { if (w.id === g.selected) sel = w; });
      if (!sel) { g.selected = null; return; }
      if (sel.size > tb.seats) { bad(g, tb.x, tb.y - 60, 'Too small'); return; }
      if (queueTask(g, { type: 'seat', tid: id, gid: g.selected, dur: 0.5 })) g.selected = null;
    } else if (tb.state === 'paid') queueTask(g, { type: 'collect', tid: id, dur: 0.8 });
    else if (gr && gr.state === 'ready') queueTask(g, { type: 'order', tid: id, dur: 0.7 });
    else if (gr && gr.state === 'waitfood') {
      var carrying = g.ari.carry.some(function (d) { return d.tid === id && d.gid === gr.id; });
      if (carrying) queueTask(g, { type: 'deliver', tid: id, dur: 0.5 });
      else { var rd = g.kitchen.ready.filter(function (d) { return d.tid === id && d.gid === gr.id; })[0];
        if (rd) { queueTask(g, { type: 'pickup', tid: id, slot: rd.slot, dur: 0.35 }); queueTask(g, { type: 'deliver', tid: id, dur: 0.5 }); } else float(g, tb.x, tb.y - 60, 'Still cooking...', '#8a7a84', 20); }
    }
  }
  function handleClick(x, y) {
    var g = G; if (!g || g.over || g.paused) return;
    var a = g.ari;
    if (Math.abs(x - a.x) < 30 && y > a.y - 150 && y < a.y + 10) { a.queue = []; a.cur = null; a.work = 0; sfx('blip'); return; }
    if (y > 70 && y < 162 && x > COUNTER.x0 && x < COUNTER.x1) {
      var best = null; g.kitchen.ready.forEach(function (d) { var dx = Math.abs(COUNTER.slotX[d.slot] - x); if (dx < 44 && (!best || dx < best.dx)) best = { d: d, dx: dx }; });
      if (!best && g.kitchen.ready.length) best = { d: g.kitchen.ready[0] };
      if (best) actCounter(best.d.tid); return;
    }
    for (var j = 0; j < g.tables.length; j++) { var tb = g.tables[j], d = TDIM[tb.seats], ex = (x - tb.x) / (d.rx + 30), ey = (y - (tb.y - 20)) / (d.ry + 64); if (ex * ex + ey * ey <= 1) { actTable(tb.id); return; } }
    for (var q = 0; q < g.waiting.length; q++) { if (x <= 246 && Math.abs(y - (262 + q * 86 - 46)) <= 54) { actGroup(g.waiting[q].id); return; } }
  }
  cv.addEventListener('pointerdown', function (e) {
    if (scene !== 'play' || !G || G.over) return;
    var r = cv.getBoundingClientRect(); handleClick((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height); e.preventDefault();
  });

  /* ---------- the frame loop ---------- */
  var lastTs = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts; now += dt;
    if (scene === 'play' && G && !G.over && AUTO) update(G, dt);
    if (scene === 'play' && G) drawPlay(G, now); else drawMenuScene(now, titleBig);
  }

  /* =========================================================
     SCREENS
     ========================================================= */
  var panel = document.getElementById('panel'), curBtns = [];
  function setMusic(name) { if (name) Snd.play(name); else { Snd.want = null; Snd.halt(); } }
  function show(html, buttons) {
    panel.innerHTML = html; var row = document.createElement('div'); row.className = 'btnrow'; curBtns = [];
    (buttons || []).forEach(function (b, i) {
      var el = document.createElement('button'); el.type = 'button'; el.className = 'btn ' + (b.cls || ''); el.innerHTML = (b.noNum ? '' : '<span class="num">' + (i + 1) + '</span>') + b.label; if (b.disabled) el.disabled = true;
      el.addEventListener('click', function () { sfx('blip'); b.run(); }); row.appendChild(el); curBtns.push(b.disabled ? null : b);
    });
    panel.appendChild(row);
    if (panel.getBoundingClientRect().top < 0) panel.scrollIntoView({ block: 'start' });
  }
  document.addEventListener('keydown', function (e) {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (scene === 'play' && G && !G.over && (e.key === ' ' || e.key === 'p' || e.key === 'P')) { G.paused = !G.paused; e.preventDefault(); return; }
    if (e.key === 'm' || e.key === 'M') { Snd.set(!Snd.on); return; }
    var n = parseInt(e.key, 10);
    if (scene !== 'play' && n >= 1 && n <= 9 && curBtns[n - 1]) { e.preventDefault(); sfx('blip'); curBtns[n - 1].run(); }
  });

  function stopPlay() { G = null; }
  function title() {
    stopPlay(); scene = 'menu'; titleBig = true; setMusic('title');
    show('<h1>Ari\'s Party Rush</h1><p class="lead">Seat the guests, serve the treats, and keep the party rolling! Run the busiest party floor in town with Ari, and practice your money math along the way.</p>',
      [{ label: 'Play', run: menu }, { label: 'How to play', cls: 'alt', run: howto }, { label: 'Party Shop', cls: 'alt', run: shop }]);
  }
  function howto() {
    scene = 'menu'; titleBig = false;
    show('<h2>How to play</h2><ol class="steps"><li><b>Seat them.</b> Click a waiting group, then click a table that fits. The number on each table is how many seats it has. A table that fits <i>exactly</i> earns a bonus.</li>' +
         '<li><b>Take the order.</b> When a table shows a speech bubble with a red <b>!</b>, click it. The order goes to the kitchen.</li>' +
         '<li><b>Serve the treats.</b> When dishes are ready on the counter, click the table. Ari picks them up and serves them. You can also click a dish on the counter first.</li>' +
         '<li><b>Collect the money.</b> When guests leave, a coin appears. Click the table to collect the money and clear it.</li></ol>' +
         '<p>Watch the <b>hearts</b>: they drain while guests wait. Quick, happy service earns tips and combos! Click Ari to cancel his to-do list. Press Space to pause. Mouse or touch.</p>',
      [{ label: 'Play', run: menu }, { label: 'Back', cls: 'ghost', run: title }]);
  }
  function menu() {
    stopPlay(); scene = 'menu'; titleBig = false; setMusic('title');
    var all = PROG.done.every(Boolean);
    panel.innerHTML = '<h2>Pick a party</h2><p class="lead">Earn at least one star to unlock the next party. Bank: <b>$' + PROG.bank + '</b>. Spend it in the Party Shop.</p>';
    var grid = document.createElement('div'); grid.className = 'grid'; curBtns = [];
    LEVELS.forEach(function (lv, i) {
      var locked = i > 0 && !PROG.done[i - 1], el = document.createElement('button'); el.type = 'button'; el.className = 'card' + (locked ? ' locked' : ''); el.disabled = locked;
      el.innerHTML = '<span class="cn">' + (i + 1) + '</span><b>' + lv.name + '</b><span class="st">' + (locked ? 'Locked' : stars(PROG.stars[i])) + '</span><span class="sm">Goal: $' + lv.goals[0] + '+ &middot; ' + lv.tables.length + ' tables</span>';
      el.addEventListener('click', function () { sfx('blip'); briefing(i); }); grid.appendChild(el);
      curBtns.push(locked ? null : { run: function () { briefing(i); } });
    });
    panel.appendChild(grid);
    var row = document.createElement('div'); row.className = 'btnrow';
    [{ label: 'Party Shop', cls: 'alt', run: shop }, { label: 'How to play', cls: 'ghost', run: howto }, { label: 'Home', cls: 'ghost', run: title }].concat(all ? [{ label: 'Graduation!', run: finale }] : []).forEach(function (b) {
      var el = document.createElement('button'); el.type = 'button'; el.className = 'btn ' + (b.cls || ''); el.textContent = b.label; el.addEventListener('click', function () { sfx('blip'); b.run(); }); row.appendChild(el); });
    panel.appendChild(row);
  }
  function briefing(li) {
    stopPlay(); scene = 'menu'; titleBig = false; var lv = LEVELS[li];
    show('<h2>Party ' + (li + 1) + ': ' + lv.name + '</h2><p class="lead">' + INTRO[li] + '</p><p class="board">GOALS: $' + lv.goals[0] + ' = 1 star &nbsp; $' + lv.goals[1] + ' = 2 stars &nbsp; $' + lv.goals[2] + ' = 3 stars<br>TABLES: ' + lv.tables.join(', ') + ' seats &nbsp; TIME: ' + lv.time + ' seconds<br>YOUR GEAR: tray holds ' + (3 + PROG.up.tray) + ' dishes</p>',
      [{ label: 'Start the party!', run: function () { startPlay(li, false); } }, { label: 'Relaxed mode (more patient guests)', cls: 'alt', run: function () { startPlay(li, true); } }, { label: 'Back', cls: 'ghost', run: menu }]);
  }
  function startPlay(li, relaxed) {
    G = newGame(li, relaxed); scene = 'play'; setMusic('party');
    show('<p class="tip"><b>Seat</b> a group, take the <b>!</b> order, serve the <b>treats</b> from the kitchen counter, and <b>collect</b> the money. Click Ari to cancel his to-do list.</p>',
      [{ label: 'Pause or resume (Space)', cls: 'ghost', noNum: true, run: function () { if (G && !G.over) G.paused = !G.paused; } }, { label: 'Quit this party', cls: 'ghost', noNum: true, run: function () { stopPlay(); menu(); } }]);
  }

  /* ---------- results + math bonus ---------- */
  function starsFor(lv, score) { var n = 0; lv.goals.forEach(function (g) { if (score >= g) n++; }); return n; }
  function numOpts(ans, steps) {
    var set = [ans]; steps.forEach(function (d) { var v = ans + d; if (v >= 0 && set.indexOf(v) < 0 && set.length < 4) set.push(v); });
    var f = 1; while (set.length < 4) { var v = ans + 3 * f++; if (set.indexOf(v) < 0) set.push(v); } return set;
  }
  function mathQ(li, st, score) {
    var q, ans, why, steps = [1, -1, 2, -2, 10, -10], money = true;
    if (li === 0) { var k = st.pizza >= st.drink ? 'pizza' : 'drink', n = st[k]; if (n === 0) { k = 'pizza'; n = 5; } var p = ITEMS[k].price; ans = n * p; q = 'You served ' + n + ' ' + ITEMS[k].plural + ' at $' + p + ' each. How much money did they earn?'; why = n + ' x $' + p + ' = $' + ans + '.'; steps = [p, -p, 1, -1, 10]; }
    else if (li === 1) { ans = st.cake * 5 + st.drink * 2; q = 'You served ' + st.cake + ' cake slices at $5 each and ' + st.drink + ' cups of punch at $2 each. How much did they earn together?'; why = st.cake + ' x $5 = $' + (st.cake * 5) + ', and ' + st.drink + ' x $2 = $' + (st.drink * 2) + '. Together: $' + ans + '.'; steps = [2, -2, 5, -5, 10]; }
    else if (li === 2) { ans = st.game * 3 + st.pizza * 4; q = 'You served ' + st.game + ' party favors at $3 each and ' + st.pizza + ' pizza slices at $4 each. How much did they earn together?'; why = st.game + ' x $3 = $' + (st.game * 3) + ', and ' + st.pizza + ' x $4 = $' + (st.pizza * 4) + '. Together: $' + ans + '.'; steps = [3, -3, 4, -4, 10]; }
    else if (li === 3) { money = false; ans = st.pizza + st.cake + st.drink + st.game; q = 'How many treats did you serve in all? You served ' + st.pizza + ' pizza slices, ' + st.cake + ' cake slices, ' + st.drink + ' cups of punch, and ' + st.game + ' party favors.'; why = st.pizza + ' + ' + st.cake + ' + ' + st.drink + ' + ' + st.game + ' = ' + ans + '.'; steps = [1, -1, 2, -2, 10]; }
    else if (li === 4) { money = false; var f = st.fits, u = st.unhappy; ans = Math.abs(f - u); q = 'You seated ' + f + ' groups at a perfect-fit table, and ' + u + ' groups left unhappy. How many MORE ' + (f >= u ? 'perfect-fit groups than unhappy groups' : 'unhappy groups than perfect-fit groups') + ' were there?'; why = (f >= u ? f + ' - ' + u : u + ' - ' + f) + ' = ' + ans + '.'; steps = [1, -1, 2, -2, 3]; }
    else { var goal = LEVELS[5].goals[2]; ans = Math.abs(score - goal); q = 'Your party earned $' + score + '. The 3-star goal was $' + goal + '. How many dollars away from the goal were you?'; why = (score >= goal ? '$' + score + ' - $' + goal : '$' + goal + ' - $' + score) + ' = $' + ans + '.'; steps = [1, -1, 5, -5, 10]; }
    return { q: q, ans: ans, why: why, money: money, opts: numOpts(ans, steps) };
  }
  function fmt(mq, n) { return (mq.money ? '$' : '') + n; }
  function endLevel() {
    var g = G; if (!g) return;
    g.tables.forEach(function (tb) { if (tb.state === 'paid') { g.score += tb.due; g.stats.earned += tb.due; tb.state = 'empty'; } });
    var mq = mathQ(g.li, g.stats, g.score); g.mq = mq; scene = 'menu'; titleBig = false; setMusic(null); sfx('pass');
    var st = g.stats, opts = shuffle(mq.opts.slice());
    show('<h2>The party is over!</h2><p class="board">PARTY SCORE: $' + g.score + '<br>GROUPS SERVED: ' + st.groups + ' &nbsp; PERFECT FITS: ' + st.fits + ' &nbsp; UNHAPPY: ' + st.unhappy + ' &nbsp; TIPS: $' + st.tips + '<br>PIZZA ' + st.pizza + ' &nbsp; CAKE ' + st.cake + ' &nbsp; PUNCH ' + st.drink + ' &nbsp; FAVORS ' + st.game + '</p>' +
         '<p class="lead"><b>Math bonus!</b> Answer correctly for +10 points.</p><p class="q">' + mq.q + '</p>',
      opts.map(function (o) { return { label: fmt(mq, o), run: function () { finishLevel(g, o === mq.ans); } }; }));
  }
  function finishLevel(g, ok) {
    var mq = g.mq, lv = g.lv, li = g.li, final = g.score + (ok ? 10 : 0), st = starsFor(lv, final);
    if (ok) sfx('correct'); else sfx('wrong');
    PROG.bank += final; if (st >= 1) { PROG.stars[li] = Math.max(PROG.stars[li], st); PROG.done[li] = true; } saveP(); G = null; if (st >= 1) setMusic('win');
    var b = [];
    if (st >= 1 && li < LEVELS.length - 1) b.push({ label: 'Next party', run: function () { briefing(li + 1); } });
    b.push({ label: 'Play again', cls: 'alt', run: function () { briefing(li); } }, { label: 'Party Shop', cls: 'alt', run: shop }, { label: 'All parties', cls: 'ghost', run: menu });
    show('<h2>' + (st >= 1 ? 'Party complete!' : 'So close!') + '</h2><p class="' + (ok ? 'good' : 'bad') + '">' + (ok ? 'Correct! +10 points.' : 'Not quite. The answer is ' + fmt(mq, mq.ans) + '.') + '</p><p>' + mq.why + '</p>' +
         '<p class="board">PARTY SCORE: $' + g.score + '<br>MATH BONUS: ' + (ok ? '+$10' : '$0') + '<br>FINAL: $' + final + '<br>STARS: <span class="gold">' + stars(st) + '</span><br>ADDED TO YOUR BANK: $' + final + ' (bank: $' + PROG.bank + ')</p>' +
         (st >= 1 ? '<p class="note"><b>PARTY NOTEBOOK</b><br>' + NOTES[li] + '</p>' : '<p>You need $' + lv.goals[0] + ' for one star. Try again: seat, order, serve, collect!</p>'), b);
  }

  /* ---------- the Party Shop ---------- */
  function shop() {
    stopPlay(); scene = 'menu'; titleBig = false;
    var html = '<h2>Party Shop</h2><p class="lead">You have <b>$' + PROG.bank + '</b> in your bank. Upgrades help in every party!</p>', btns = [];
    UPS.forEach(function (u) {
      var lvl = PROG.up[u.k], max = lvl >= u.costs.length, cost = max ? 0 : u.costs[lvl], can = !max && PROG.bank >= cost, pips = '';
      for (var i = 0; i < u.costs.length; i++) pips += i < lvl ? '\u25CF' : '\u25CB';
      html += '<div class="up"><b>' + u.name + '</b> <span class="pips">' + pips + '</span><br><span class="sm">' + u.desc + '</span><br><span class="sm">' + (max ? 'Fully upgraded!' : 'Cost: $' + cost + (can ? ' &middot; you would have $' + (PROG.bank - cost) + ' left' : ' &middot; you need $' + (cost - PROG.bank) + ' more')) + '</span></div>';
      btns.push({ label: max ? u.name + ' (maxed)' : 'Buy ' + u.name + ' for $' + cost, disabled: !can, run: function () { PROG.bank -= cost; PROG.up[u.k]++; saveP(); sfx('coin'); shop(); } });
    });
    btns.push({ label: 'Back', cls: 'ghost', run: menu });
    show(html, btns);
  }
  function finale() {
    var tot = totalStars(), rank = tot >= 16 ? 'PARTY RUSH CHAMPION' : tot >= 12 ? 'EVENT PLANNER' : 'PARTY HELPER'; sfx('pass'); setMusic('win');
    show('<h2>Graduation day!</h2><p class="lead">You ran six parties without dropping a single balloon! You seated the guests, served the treats, kept everyone happy, and did the math like a pro.</p><p class="board">CERTIFICATE OF PARTY PLANNING<br>PARTIES: 6 OF 6<br>STARS: ' + tot + ' OF 18<br>RANK: <span class="gold">' + rank + '</span></p>', [{ label: 'Back to the parties', run: menu }]);
  }

  /* ---------- sound button + start ---------- */
  var sndBtn = document.getElementById('snd');
  function sndLabel() { sndBtn.textContent = 'Sound: ' + (Snd.on ? 'On' : 'Off'); sndBtn.setAttribute('aria-pressed', Snd.on ? 'true' : 'false'); }
  try { Snd.on = localStorage.getItem('ariRushSound') === '1'; } catch (e) { /* ignore */ }
  sndLabel();
  sndBtn.addEventListener('click', function () { Snd.set(!Snd.on); });
  function unlockAudio() { if (Snd.on && !Snd.ctx && Snd.init()) { Snd.ctx.resume(); Snd.cur = null; Snd.play(Snd.want); } }
  document.addEventListener('pointerdown', unlockAudio); document.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', function () { if (!Snd.ctx) return; if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume(); });

  if (typeof window !== 'undefined' && window.__manual) {
    window.__PR = { step: function (dt) { update(G, dt); }, actGroup: actGroup, actTable: actTable, actCounter: actCounter, state: function () { return G; }, mathAns: function () { return G && G.mq ? fmt(G.mq, G.mq.ans) : null; }, draw: function () { if (scene === 'play' && G) drawPlay(G, now); else drawMenuScene(now, titleBig); } };
  }
  loadP(); buildBG(); title(); requestAnimationFrame(frame);

})();
</script>
</body>
</html>
