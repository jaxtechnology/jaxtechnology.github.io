<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holiday Coloring - Jax Technology</title>
<style>
  :root {
    --paper: #f5f6fb;
    --panel: #ffffff;
    --ink: #1b2140;
    --ink-soft: #565d7a;
    --indigo: #4a4ddb;
    --sun: #ffc83d;
    --teal: #0b7a6e;
    --coral: #ff6b57;
    --line: #d9dcea;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #12152b; --panel: #1b1f3b; --ink: #f1f2fb; --ink-soft: #aab0cc; --line: #343a5e; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font);
    font-size: 1.0625rem; line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; }
  @media (prefers-color-scheme: dark) { :focus-visible { outline-color: var(--sun); } }
  [hidden] { display: none !important; }

  /* ---------- Coloring page art ---------- */
  .art-svg { display: block; width: 100%; height: auto; background: #fff; }
  .art-svg rect, .art-svg circle, .art-svg ellipse, .art-svg path, .art-svg polygon {
    fill: #fff; stroke: #23253a; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; fill-rule: evenodd;
  }
  .art-svg .ln { fill: none !important; stroke-width: 3; pointer-events: none; }
  .art-svg .ink { fill: #23253a !important; pointer-events: none; }
  .art-svg .thick { stroke-width: 8; }
  .art-svg .thin { stroke-width: 1.5; }
  .art-svg .strokes .cl { fill: none !important; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .art-svg .strokes .mark { pointer-events: visiblePainted; stroke-width: 3.5; }
  .art-svg .strokes .mline { pointer-events: none; }
  .art-svg .ecursor { fill: rgba(255,255,255,.35) !important; stroke: #23253a; stroke-width: 2; stroke-dasharray: 5 4; pointer-events: none; }

  /* ---------- Gallery ---------- */
  #gallery { max-width: 1040px; margin: 0 auto; padding: 36px 20px 64px; }
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .home-link { color: var(--ink-soft); font-weight: 700; text-decoration: none; }
  .home-link:hover { color: var(--ink); text-decoration: underline; }
  h1 { margin: 6px 0 0; font-size: clamp(2.3rem, 7vw, 3.8rem); font-weight: 800; line-height: 1; letter-spacing: -0.035em; }
  .subtitle { margin: 10px 0 0; color: var(--ink-soft); font-size: 1.15rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 0; padding: 0; list-style: none; }
  .chip {
    min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--line);
    background: transparent; font-weight: 700; cursor: pointer;
  }
  .chip:hover { border-color: var(--ink-soft); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; margin-top: 24px; }
  .pic {
    display: block; padding: 0; border: 0; background: none; text-align: left; cursor: pointer;
  }
  .pic .frame { border-radius: 16px; overflow: hidden; border: 2px solid var(--line); transition: transform .12s ease, border-color .12s ease; }
  .pic:hover .frame { transform: translateY(-3px); border-color: var(--ink-soft); }
  .pic .name { display: block; margin-top: 8px; font-weight: 800; font-size: 1.05rem; line-height: 1.2; }
  .pic .hol { display: block; color: var(--ink-soft); font-size: 0.92rem; }

  /* ---------- Editor ---------- */
  #editor { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 2px solid var(--line); background: var(--panel);
  }
  .bar h2 { margin: 0 auto 0 6px; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
    border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer;
  }
  .btn:hover { border-color: var(--ink-soft); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .btn.warn { background: var(--coral); border-color: var(--coral); color: #1b2140; }
  .btn:disabled { opacity: .45; cursor: default; }

  .work { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  .stage-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; min-height: 0; }
  #stage {
    width: min(100%, calc(100dvh - 120px)); aspect-ratio: 1; border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 2px var(--line); touch-action: none; position: relative;
  }
  #stage svg { width: 100%; height: 100%; }
  #stage.mode-fill { cursor: pointer; }
  #stage.mode-erase { cursor: none; }
  #stage.mode-draw, #stage.mode-rainbow, #stage.mode-shape, #stage.mode-stamp { cursor: crosshair; }
  .nav { width: 48px; height: 48px; flex: none; border-radius: 50%; padding: 0; justify-content: center; }

  .side { border-left: 2px solid var(--line); background: var(--panel); padding: 16px 16px 20px; overflow-y: auto; }
  .side h3 { margin: 0 0 8px; font-size: 1rem; font-weight: 800; color: var(--ink-soft); }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px;
    border-radius: 12px; border: 2px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; font-size: .92rem;
  }
  .tool svg { width: 28px; height: 28px; }
  .tool[aria-pressed="true"] { border-color: var(--indigo); background: color-mix(in srgb, var(--indigo) 14%, transparent); }
  @media (prefers-color-scheme: dark) { .tool[aria-pressed="true"] { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 16%, transparent); } }
  .sizes { display: flex; gap: 8px; margin-top: 8px; }
  .sizes .tool { flex: 1; flex-direction: row; justify-content: center; gap: 8px; }
  .dot { border-radius: 50%; background: currentColor; display: inline-block; }

  /* The crayon box */
  .box { margin-top: 18px; }
  .crayons { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .crayon {
    position: relative; display: flex; align-items: center; height: 30px; padding: 0; border: 0; background: none;
    cursor: pointer; transition: transform .12s ease;
  }
  .crayon .tip { width: 18px; height: 22px; background: var(--c); clip-path: polygon(100% 0, 100% 100%, 0 50%); flex: none; }
  .crayon .body {
    flex: 1; height: 22px; border-radius: 0 6px 6px 0; background: var(--c); position: relative;
    box-shadow: inset 0 0 0 1.5px rgba(27,33,64,.28);
  }
  .crayon .body::before, .crayon .body::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 5px; background: rgba(27,33,64,.22);
  }
  .crayon .body::before { left: 14px; } .crayon .body::after { right: 14px; }
  .crayon[aria-pressed="true"] { transform: translateX(-10px); }
  .crayon.white .tip { background: #dfe2ee; }
  .crayon.white .body { box-shadow: inset 0 0 0 1.5px rgba(27,33,64,.4); }
  .crayon[aria-pressed="true"] .body { box-shadow: inset 0 0 0 1.5px rgba(27,33,64,.28), 0 0 0 3px var(--panel), 0 0 0 5px var(--ink); }
  .tools { grid-template-columns: repeat(3, 1fr); }
  .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 8px; }
  .pick { height: 44px; padding: 6px; border-radius: 10px; border: 2px solid var(--line); background: transparent; cursor: pointer; }
  .pick svg { width: 100%; height: 100%; }
  .pick svg path { fill: none; stroke: currentColor; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
  .pick svg path.pl { stroke-width: 5; opacity: .7; }
  .pick[aria-pressed="true"] { border-color: var(--indigo); background: color-mix(in srgb, var(--indigo) 14%, transparent); }
  @media (prefers-color-scheme: dark) { .pick[aria-pressed="true"] { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 16%, transparent); } }
  .hint { margin: 10px 0 0; color: var(--ink-soft); font-size: .92rem; line-height: 1.35; min-height: 2.5em; }
  .now { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--ink-soft); font-weight: 700; }
  .now span:first-child { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--c); }

  @media (max-width: 820px) {
    #editor { height: auto; min-height: 100dvh; }
    .work { grid-template-columns: 1fr; }
    .side { border-left: 0; border-top: 2px solid var(--line); }
    #stage { width: 100%; }
    .stage-wrap { padding: 10px; gap: 6px; }
    .nav { width: 40px; height: 40px; }
    .crayons { grid-template-columns: repeat(3, 1fr); }
    .bar .label { display: none; }
  }

  @media (prefers-reduced-motion: reduce) { .pic .frame, .crayon { transition: none; } }

  @media print {
    body { background: #fff; }
    #gallery, .bar, .side, .nav { display: none !important; }
    #editor { display: block !important; height: auto; }
    .work, .stage-wrap { display: block; padding: 0; }
    #stage { width: 100%; box-shadow: none; }
  }
</style>
</head>
<body>

<main id="gallery">
  <div class="top">
    <div>
      <a class="home-link" href="/">Jax Technology</a>
      <h1>Holiday Coloring</h1>
      <p class="subtitle">Pick a picture to color, or start with a blank page and make your own.</p>
    </div>
  </div>
  <ul class="chips" id="chips" aria-label="Holidays"></ul>
  <div class="pics" id="pics"></div>
</main>

<div id="editor" hidden>
  <div class="bar">
    <button class="btn" id="backBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>All pictures</span>
    </button>
    <h2 id="picTitle"></h2>
    <button class="btn" id="undoBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span class="label">Undo</span>
    </button>
    <button class="btn" id="clearBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span class="label" id="clearLabel">Start over</span>
    </button>
    <button class="btn" id="printBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
      <span class="label">Print</span>
    </button>
    <button class="btn primary" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
      <span class="label">Save picture</span>
    </button>
  </div>
  <div class="work">
    <div class="stage-wrap">
      <button class="btn nav" id="prevBtn" type="button" aria-label="Previous picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="stage"></div>
      <button class="btn nav" id="nextBtn" type="button" aria-label="Next picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <aside class="side" aria-label="Coloring tools">
      <h3>Tools</h3>
      <div class="tools" id="tools">
        <button class="tool" type="button" data-mode="draw" aria-pressed="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M21 4l7 7-14 14H7v-7z"/><path d="M17 8l7 7"/><path d="M4 29c4-3 8 1 12-2"/></svg>
          Crayon
        </button>
        <button class="tool" type="button" data-mode="rainbow" aria-pressed="false">
          <svg viewBox="0 0 32 32" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 24a12 12 0 0 1 24 0" stroke="#e8333a"/><path d="M8.5 24a7.5 7.5 0 0 1 15 0" stroke="#ffb020"/><path d="M13 24a3 3 0 0 1 6 0" stroke="#2d6fe0"/></svg>
          Rainbow
        </button>
        <button class="tool" type="button" data-mode="fill" aria-pressed="false">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 15L15 6l11 11-9 9z"/><path d="M6 15h20"/><path d="M27 21c0 0 3 4 3 6a3 3 0 0 1-6 0c0-2 3-6 3-6z" fill="currentColor"/></svg>
          Fill
        </button>
        <button class="tool" type="button" data-mode="shape" aria-pressed="false">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="14" width="14" height="14" rx="1"/><circle cx="21" cy="11" r="8"/></svg>
          Shapes
        </button>
        <button class="tool" type="button" data-mode="stamp" aria-pressed="false">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M16 3l3.8 7.8 8.5 1.2-6.2 6 1.5 8.5L16 22.5 8.4 26.5l1.5-8.5-6.2-6 8.5-1.2z"/></svg>
          Stamps
        </button>
        <button class="tool" type="button" data-mode="erase" aria-pressed="false">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 27L4 19 18 5l10 10-12 12z"/><path d="M11 12l10 10"/><path d="M12 27h16"/></svg>
          Eraser
        </button>
      </div>
      <div class="sizes" id="sizes">
        <button class="tool" type="button" data-size="7" aria-pressed="true"><span class="dot" style="width:8px;height:8px"></span>Small</button>
        <button class="tool" type="button" data-size="18" aria-pressed="false"><span class="dot" style="width:16px;height:16px"></span>Big</button>
      </div>
      <div class="picker" id="shapePicker" hidden aria-label="Shapes"></div>
      <div class="picker" id="stampPicker" hidden aria-label="Stamps"></div>
      <p class="hint" id="hint"></p>
      <div class="box">
        <h3>Crayons</h3>
        <div class="crayons" id="crayons"></div>
        <div class="now"><span id="nowSwatch"></span><span id="nowName"></span></div>
      </div>
    </aside>
  </div>
</div>

function load(id) {
  try { const v = localStorage.getItem('holiday-coloring:' + id); if (v) { const o = JSON.parse(v); return { fills: o.fills || {}, strokes: o.strokes || [] }; } } catch (e) {}
  return { fills: {}, strokes: [] };
}
function save() {
  try { localStorage.setItem('holiday-coloring:' + current.id, JSON.stringify(state)); } catch (e) {}
}

/* ---------- geometry helpers ---------- */
const r1 = v => Math.round(v * 10) / 10;
function circlePath(cx, cy, rx, ry) {
  const k = 0.5523;
  return `M${cx - rx} ${cy} C${cx - rx} ${cy - ry * k} ${cx - rx * k} ${cy - ry} ${cx} ${cy - ry} C${cx + rx * k} ${cy - ry} ${cx + rx} ${cy - ry * k} ${cx + rx} ${cy} C${cx + rx} ${cy + ry * k} ${cx + rx * k} ${cy + ry} ${cx} ${cy + ry} C${cx - rx * k} ${cy + ry} ${cx - rx} ${cy + ry * k} ${cx - rx} ${cy}Z`;
}
function starPts(n, R, r) {
  const p = [];
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; p.push([q * Math.cos(a), q * Math.sin(a)]); }
  return p;
}
const ptsD = (p, close = true) => 'M' + p.map(q => r1(q[0]) + ' ' + r1(q[1])).join(' L') + (close ? 'Z' : '');
function heartPts(n = 60) {
  const p = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2;
    p.push([16 * Math.sin(t) ** 3 / 17, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17 + 0.1]);
  }
  return p;
}

/* Shapes: outline points inside the box x1,y1 - x2,y2 */
const SHAPES = {
  circle:   (x, y, w, h) => { const p = []; for (let i = 0; i < 64; i++) { const a = i / 64 * Math.PI * 2; p.push([x + w / 2 + w / 2 * Math.cos(a), y + h / 2 + h / 2 * Math.sin(a)]); } return p; },
  square:   (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]],
  triangle: (x, y, w, h) => [[x + w / 2, y], [x + w, y + h], [x, y + h]],
  star:     (x, y, w, h) => starPts(5, 1, 0.42).map(([a, b]) => [x + w / 2 + a * w / 2, y + h * 0.53 + b * h * 0.53]),
  heart:    (x, y, w, h) => heartPts().map(([a, b]) => [x + w / 2 + a * w / 2, y + h / 2 + b * h / 2]),
  line:     null
};
const SHAPE_NAMES = { circle: 'Circle', square: 'Square', triangle: 'Triangle', star: 'Star', heart: 'Heart', line: 'Line' };
function shapeOutline(m) {
  if (m.type === 'line') return [[m.x1, m.y1], [m.x2, m.y2]];
  const x = Math.min(m.x1, m.x2), y = Math.min(m.y1, m.y2);
  return SHAPES[m.type](x, y, Math.abs(m.x2 - m.x1), Math.abs(m.y2 - m.y1));
}

/* Stamps: drawn in a -50..50 box. "main" is the colored part; "ln" parts are outline details. */
const STAMPS = {
  star:     { name: 'Star', main: ptsD(starPts(5, 50, 21).map(([a, b]) => [a, b + 5])) },
  heart:    { name: 'Heart', main: ptsD(heartPts().map(([a, b]) => [a * 50, b * 50])) },
  snowflake:{ name: 'Snowflake', main: ptsD(starPts(6, 50, 22)), ln: 'M0 -38 L0 38 M-33 -19 L33 19 M-33 19 L33 -19' },
  pumpkin:  { name: 'Pumpkin', main: 'M-46 4 C-46 -30 -22 -36 0 -28 C22 -36 46 -30 46 4 C46 38 22 46 0 40 C-22 46 -46 38 -46 4Z', ln: 'M-14 -32 C-26 -8 -26 22 -14 42 M14 -32 C26 -8 26 22 14 42 M0 -28 L4 -46' },
  bat:      { name: 'Bat', main: 'M-50 0 Q-38 -20 -15 -9 Q-10 -20 -5 -11 L0 -16 L5 -11 Q10 -20 15 -9 Q38 -20 50 0 Q35 -4 28 10 Q18 0 10 9 Q5 4 0 13 Q-5 4 -10 9 Q-18 0 -28 10 Q-35 -4 -50 0Z' },
  tree:     { name: 'Tree', main: 'M0 -50 L22 -22 L11 -22 L33 6 L18 6 L42 36 L-42 36 L-18 6 L-33 6 L-11 -22 L-22 -22Z', ln: 'M-7 36 L-7 50 L7 50 L7 36' },
  ornament: { name: 'Ornament', main: circlePath(0, 8, 40, 40), ln: 'M-10 -32 L-10 -42 L10 -42 L10 -32 M0 -42 L0 -50 M-36 -6 Q0 8 36 -6 M-36 22 Q0 36 36 22' },
  gift:     { name: 'Gift', main: 'M-40 -18 L40 -18 L40 46 L-40 46Z', ln: 'M-8 -18 L-8 46 M8 -18 L8 46 M0 -18 C-30 -50 -40 -20 0 -18 C40 -20 30 -50 0 -18' },
  shamrock: { name: 'Shamrock', main: [0, 120, 240].map(r => { const a = r * Math.PI / 180; return ptsD(heartPts().map(([x, y]) => { const px = x * 26, py = (y - 0.9) * 26; return [px * Math.cos(a) - py * Math.sin(a), px * Math.sin(a) + py * Math.cos(a) - 6]; })); }).join(' '), ln: 'M0 -6 C2 18 8 34 18 48', nz: true },
  egg:      { name: 'Egg', main: 'M0 -50 C28 -50 40 -4 40 14 C40 38 22 50 0 50 C-22 50 -40 38 -40 14 C-40 -4 -28 -50 0 -50Z', ln: 'M-38 0 L-26 -12 L-13 0 L0 -12 L13 0 L26 -12 L38 0 M-40 20 L40 20' },
  flower:   { name: 'Flower', main: [0, 1, 2, 3, 4, 5].map(k => { const a = k * Math.PI / 3, c = Math.cos(a), s = Math.sin(a), T = (x, y) => r1(x * c - y * s) + ' ' + r1(x * s + y * c); return `M${T(-9, -11)} C${T(-26, -22)} ${T(-20, -50)} ${T(0, -50)} C${T(20, -50)} ${T(26, -22)} ${T(9, -11)}Z`; }).join(' ') + ' ' + circlePath(0, 0, 14, 14), nz: true },
  moon:     { name: 'Moon', main: 'M12 -48 C-34 -44 -44 30 14 48 C-12 30 -16 -26 12 -48Z' },
  sun:      { name: 'Sun', main: circlePath(0, 0, 28, 28), ln: [0, 1, 2, 3, 4, 5, 6, 7].map(k => { const a = k * Math.PI / 4; return `M${r1(36 * Math.cos(a))} ${r1(36 * Math.sin(a))} L${r1(50 * Math.cos(a))} ${r1(50 * Math.sin(a))}`; }).join(' ') }
};
function movePath(d, x, y, s) {
  // every stamp path uses absolute commands with x,y pairs only, so numbers can be moved pairwise
  let i = 0;
  return d.replace(/-?\d+(\.\d+)?/g, v => { const out = i % 2 ? y + v * s : x + v * s; i++; return r1(out); });
}

/* ---------- building a picture ---------- */
function regionsOf(svg) {
  return [...svg.querySelectorAll('rect,circle,ellipse,path,polygon')].filter(el =>
    !el.classList.contains('ln') && !el.classList.contains('ink') && !el.classList.contains('ecursor') && !el.closest('.strokes'));
}
function buildSVG(pic, st) {
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 400 400');
  svg.setAttribute('class', 'art-svg');
  svg.innerHTML = pic.svg + '<g class="strokes"></g>';
  regionsOf(svg).forEach((el, i) => {
    el.dataset.i = i;
    if (st.fills[i]) el.style.fill = st.fills[i];
  });
  const g = svg.querySelector('.strokes');
  st.strokes.forEach((s, i) => g.appendChild(markEl(s, i)));
  return svg;
}
function strokeEl(s) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('class', 'cl');
  p.setAttribute('d', s.d);
  p.style.stroke = s.c;
  p.style.strokeWidth = s.w;
  return p;
}
function markEl(m, i) {
  if (!m.k) return strokeEl(m);
  if (m.k === 'shape') {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('class', m.type === 'line' ? 'mark mline' : 'mark');
    p.setAttribute('d', ptsD(shapeOutline(m), m.type !== 'line'));
    p.style.stroke = m.c === '#ffffff' ? DARK : m.c;
    p.style.strokeWidth = m.w;
    p.style.fill = m.type === 'line' ? 'none' : (m.f || 'rgba(255,255,255,0)');
    if (i !== undefined) p.dataset.m = i;
    return p;
  }
  const st = STAMPS[m.type], g = document.createElementNS(NS, 'g');
  const main = document.createElementNS(NS, 'path');
  main.setAttribute('class', 'mark');
  main.setAttribute('d', movePath(st.main, m.x, m.y, m.s));
  main.style.fill = m.f || m.c;
  if (st.nz) main.style.fillRule = 'nonzero';
  if (i !== undefined) main.dataset.m = i;
  g.appendChild(main);
  if (st.ln) {
    const l = document.createElementNS(NS, 'path');
    l.setAttribute('class', 'ln');
    l.setAttribute('d', movePath(st.ln, m.x, m.y, m.s));
    g.appendChild(l);
  }
  return g;
}

/* ---------- gallery ---------- */
function renderChips() {
  const ul = $('#chips'); ul.innerHTML = '';
  ['All', ...DATA.holidays].forEach(h => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = h;
    b.setAttribute('aria-pressed', h === filter);
    b.onclick = () => { filter = h; renderChips(); renderPics(); };
    li.appendChild(b); ul.appendChild(li);
  });
}
function renderPics() {
  const box = $('#pics'); box.innerHTML = '';
  DATA.pictures.filter(p => filter === 'All' || p.holiday === filter).forEach(p => {
    const b = document.createElement('button');
    b.className = 'pic'; b.type = 'button';
    const fr = document.createElement('span'); fr.className = 'frame'; fr.style.display = 'block';
    const svg = buildSVG(p, load(p.id)); svg.setAttribute('aria-hidden', 'true');
    fr.appendChild(svg);
    const n = document.createElement('span'); n.className = 'name'; n.textContent = p.title;
    const h = document.createElement('span'); h.className = 'hol'; h.textContent = p.holiday;
    b.append(fr, n, h);
    b.onclick = () => open(p.id);
    box.appendChild(b);
  });
}

/* ---------- editor ---------- */
function open(id, fromHash) {
  const pic = DATA.pictures.find(p => p.id === id);
  if (!pic) return showGallery();
  current = pic; state = load(id); undoStack = [];
  $('#picTitle').textContent = pic.title;
  rebuildStage();
  $('#gallery').hidden = true; $('#editor').hidden = false;
  document.title = pic.title + ' - Holiday Coloring';
  if (!fromHash && location.hash !== '#' + id) location.hash = id;
  resetClear(); updateUndo();
  window.scrollTo(0, 0);
}
function rebuildStage() {
  const stage = $('#stage'); stage.innerHTML = '';
  stage.appendChild(buildSVG(current, state));
  stage.querySelector('svg').setAttribute('aria-label', current.title + ' coloring page');
  addCursor();
}
function showGallery() {
  $('#editor').hidden = true; $('#gallery').hidden = false;
  document.title = 'Holiday Coloring - Jax Technology';
  if (location.hash) location.hash = '';
  renderPics();
}
function step(dir) {
  const list = DATA.pictures.filter(p => filter === 'All' || p.holiday === filter);
  let i = list.findIndex(p => p.id === current.id);
  if (i < 0) { const all = DATA.pictures; i = all.findIndex(p => p.id === current.id); open(all[(i + dir + all.length) % all.length].id); return; }
  open(list[(i + dir + list.length) % list.length].id);
}

function setFill(i, c) {
  const el = $('#stage').querySelector('[data-i="' + i + '"]');
  if (!el) return;
  if (c) { el.style.fill = c; state.fills[i] = c; } else { el.style.fill = ''; delete state.fills[i]; }
}
function setMarkFill(m, c) {
  if (c) state.strokes[m].f = c; else delete state.strokes[m].f;
  redrawStrokes();
}
function svgPoint(e) {
  const svg = $('#stage svg'); const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [r1(Math.max(0, Math.min(400, p.x))), r1(Math.max(0, Math.min(400, p.y)))];
}
function commit(entry) { undoStack.push(entry); save(); updateUndo(); resetClear(); }

/* ---------- eraser ----------
   Rubbing removes crayon marks under it (only the part you rub), and any shape or stamp it touches.
   A quick tap on a filled shape clears that shape's color. */
let drawing = null, erasing = null, shaping = null;
function eraserR() { return size * 1.2; }
function parsePts(d) {
  const n = d.match(/-?\d+(\.\d+)?/g).map(Number), p = [];
  for (let i = 0; i + 1 < n.length; i += 2) p.push([n[i], n[i + 1]]);
  return p;
}
function densify(p, closed) {
  if (closed) p = [...p, p[0]];
  const out = [p[0]];
  for (let i = 1; i < p.length; i++) {
    const [ax, ay] = p[i - 1], [bx, by] = p[i];
    const k = Math.ceil(Math.hypot(bx - ax, by - ay) / 2);
    for (let j = 1; j <= k; j++) out.push([ax + (bx - ax) * j / k, ay + (by - ay) * j / k]);
  }
  return out;
}
function toD(p) {
  if (p.length === 1) p = [p[0], p[0]];
  return 'M' + p.map(q => r1(q[0]) + ' ' + r1(q[1])).join(' L');
}
function eraseAt(x, y) {
  const R = eraserR(); let changed = false; const next = [];
  for (const s of state.strokes) {
    if (s.k === 'stamp') {
      if (Math.hypot(s.x - x, s.y - y) < 46 * s.s + R) { changed = true; continue; }
      next.push(s); continue;
    }
    if (s.k === 'shape') {
      const reach = R + s.w / 2;
      if (densify(shapeOutline(s), s.type !== 'line').some(([px, py]) => Math.hypot(px - x, py - y) < reach)) { changed = true; continue; }
      next.push(s); continue;
    }
    const reach = R + s.w / 2;
    const pts = parsePts(s.d);
    if (!pts.some(([px, py]) => Math.abs(px - x) < reach + 40 && Math.abs(py - y) < reach + 40)) { next.push(s); continue; }
    const dense = densify(pts);
    if (!dense.some(([px, py]) => Math.hypot(px - x, py - y) < reach)) { next.push(s); continue; }
    changed = true;
    let run = [];
    for (const q of dense) {
      if (Math.hypot(q[0] - x, q[1] - y) < reach) { if (run.length) next.push({ d: toD(run), c: s.c, w: s.w }); run = []; }
      else run.push(q);
    }
    if (run.length) next.push({ d: toD(run), c: s.c, w: s.w });
  }
  if (changed) { state.strokes = next; redrawStrokes(); }
  return changed;
}
function redrawStrokes() {
  const g = $('#stage .strokes'); g.innerHTML = '';
  state.strokes.forEach((s, i) => g.appendChild(markEl(s, i)));
}
function addCursor() {
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('class', 'ecursor'); c.setAttribute('r', eraserR()); c.style.display = 'none';
  $('#stage svg').appendChild(c);
}
function showCursor(on, x, y) {
  const c = $('#stage .ecursor'); if (!c) return;
  c.style.display = on ? '' : 'none';
  if (on) { c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', eraserR()); }
}

/* ---------- pointer input ---------- */
let hue = 0;
const rainbowColor = () => `hsl(${Math.round(hue) % 360} 85% 52%)`;

$('#stage').addEventListener('pointerdown', e => {
  if (!current || e.button > 0) return;
  const [x, y] = svgPoint(e);

  if (mode === 'draw' || mode === 'rainbow') {
    e.preventDefault(); $('#stage').setPointerCapture(e.pointerId);
    const s = { d: `M${x} ${y} L${x} ${y}`, c: mode === 'rainbow' ? rainbowColor() : color, w: size };
    const el = strokeEl(s); $('#stage .strokes').appendChild(el);
    drawing = { segs: [s], s, el, last: [x, y], n: 0 };
    return;
  }
  if (mode === 'shape') {
    e.preventDefault(); $('#stage').setPointerCapture(e.pointerId);
    const m = { k: 'shape', type: shapeType, x1: x, y1: y, x2: x, y2: y, c: color, w: size === 7 ? 4 : 9 };
    const el = markEl(m); $('#stage .strokes').appendChild(el);
    shaping = { m, el };
    return;
  }
  if (mode === 'stamp') {
    const s = size === 7 ? 0.45 : 0.9;
    state.strokes.push({ k: 'stamp', type: stampType, x, y, s, c: color === '#ffffff' ? '#ffffff' : color });
    redrawStrokes(); commit({ t: 'stroke', n: 1 });
    return;
  }
  if (mode === 'erase') {
    e.preventDefault();
    const target = e.target.closest('[data-m]') || e.target.closest('[data-i]');
    $('#stage').setPointerCapture(e.pointerId);
    erasing = { before: JSON.parse(JSON.stringify(state.strokes)), changed: false, moved: 0, last: [x, y], target, tx: x, ty: y };
    showCursor(true, x, y);
    return;
  }
  // Fill
  const next = color === '#ffffff' ? null : color;
  const mk = e.target.closest('[data-m]');
  if (mk) {
    const m = +mk.dataset.m, prev = state.strokes[m].f || null;
    if (prev === next) return;
    setMarkFill(m, next); commit({ t: 'mfill', m, prev, next });
    return;
  }
  const el = e.target.closest('[data-i]');
  if (!el) return;
  const i = el.dataset.i, prev = state.fills[i] || null;
  if (prev === next) return;
  setFill(i, next); commit({ t: 'fill', i, prev, next });
});

$('#stage').addEventListener('pointermove', e => {
  if (!current) return;
  if (drawing) {
    const [x, y] = svgPoint(e);
    const [lx, ly] = drawing.last;
    if (Math.hypot(x - lx, y - ly) < 1.5) return;
    drawing.s.d += ` L${x} ${y}`; drawing.last = [x, y]; drawing.n++;
    drawing.el.setAttribute('d', drawing.s.d);
    if (mode === 'rainbow' && drawing.n >= 4) {
      // start a new piece in the next color, joined to the last point
      hue += 18;
      const s = { d: `M${x} ${y} L${x} ${y}`, c: rainbowColor(), w: size };
      const el = strokeEl(s); $('#stage .strokes').appendChild(el);
      drawing.segs.push(s); drawing.s = s; drawing.el = el; drawing.n = 0;
    }
    return;
  }
  if (shaping) {
    const [x, y] = svgPoint(e);
    let { m } = shaping; m.x2 = x; m.y2 = y;
    if (e.shiftKey && m.type !== 'line') { const d = Math.max(Math.abs(x - m.x1), Math.abs(y - m.y1)); m.x2 = m.x1 + Math.sign(x - m.x1 || 1) * d; m.y2 = m.y1 + Math.sign(y - m.y1 || 1) * d; }
    const el = markEl(m); shaping.el.replaceWith(el); shaping.el = el;
    return;
  }
  if (mode !== 'erase') return;
  const [x, y] = svgPoint(e);
  showCursor(true, x, y);
  if (!erasing) return;
  const [lx, ly] = erasing.last;
  const dist = Math.hypot(x - lx, y - ly);
  erasing.moved += dist;
  if (erasing.moved < 6) return;           // still a tap
  if (!erasing.started) { erasing.started = true; if (eraseAt(erasing.tx, erasing.ty)) erasing.changed = true; }
  const steps = Math.max(1, Math.ceil(dist / 3));
  for (let k = 1; k <= steps; k++) {
    if (eraseAt(lx + (x - lx) * k / steps, ly + (y - ly) * k / steps)) erasing.changed = true;
  }
  erasing.last = [x, y];
});
$('#stage').addEventListener('pointerleave', () => { if (!erasing) showCursor(false); });

function endStroke() {
  if (drawing) {
    state.strokes.push(...drawing.segs);
    const n = drawing.segs.length; drawing = null;
    commit({ t: 'stroke', n });
  }
  if (shaping) {
    const { m } = shaping; shaping = null;
    if (Math.hypot(m.x2 - m.x1, m.y2 - m.y1) < 8) {
      // a tap places a medium-sized shape
      const h = size === 7 ? 40 : 70;
      if (m.type === 'line') { m.x1 -= h; m.x2 = m.x1 + 2 * h; m.y2 = m.y1; }
      else { m.x2 = m.x1 + h; m.y2 = m.y1 + h; m.x1 -= h; m.y1 -= h; }
    }
    state.strokes.push(m); redrawStrokes();
    commit({ t: 'stroke', n: 1 });
  }
  if (erasing) {
    const er = erasing; erasing = null;
    if (!er.started) {
      // a tap: clear the color of the tapped shape, or remove crayon right there
      const t = er.target;
      if (t && t.dataset.m !== undefined && state.strokes[+t.dataset.m] && state.strokes[+t.dataset.m].f) {
        const m = +t.dataset.m; commit({ t: 'mfill', m, prev: state.strokes[m].f, next: null }); setMarkFill(m, null); save();
        return;
      }
      if (eraseAt(er.tx, er.ty)) { commit({ t: 'strokes', prev: er.before }); return; }
      if (t && t.dataset.i !== undefined && state.fills[t.dataset.i]) {
        const i = t.dataset.i; commit({ t: 'fill', i, prev: state.fills[i], next: null }); setFill(i, null); save();
      }
      return;
    }
    if (er.changed) commit({ t: 'strokes', prev: er.before });
  }
}
$('#stage').addEventListener('pointerup', endStroke);
$('#stage').addEventListener('pointercancel', endStroke);

function undo() {
  const h = undoStack.pop(); if (!h) return;
  if (h.t === 'fill') setFill(h.i, h.prev);
  else if (h.t === 'mfill') setMarkFill(h.m, h.prev);
  else if (h.t === 'stroke') { state.strokes.splice(state.strokes.length - (h.n || 1)); redrawStrokes(); }
  else if (h.t === 'strokes') { state.strokes = h.prev; redrawStrokes(); }
  else if (h.t === 'clear') { state = h.prev; rebuildStage(); }
  save(); updateUndo();
}
function updateUndo() { $('#undoBtn').disabled = undoStack.length === 0; }

let clearTimer = null;
function resetClear() {
  clearTimeout(clearTimer);
  $('#clearBtn').classList.remove('warn'); $('#clearLabel').textContent = 'Start over';
}
$('#clearBtn').onclick = () => {
  const btn = $('#clearBtn');
  if (!btn.classList.contains('warn')) {
    btn.classList.add('warn'); $('#clearLabel').textContent = 'Tap again to erase all';
    clearTimer = setTimeout(resetClear, 3000);
    return;
  }
  resetClear();
  if (!Object.keys(state.fills).length && !state.strokes.length) return;
  undoStack.push({ t: 'clear', prev: JSON.parse(JSON.stringify(state)) });
  state = { fills: {}, strokes: [] };
  rebuildStage(); save(); updateUndo();
};

/* ---------- tools, pickers & crayons ---------- */
const HINTS = {
  draw: 'Drag to draw.',
  rainbow: 'Drag to draw in every color.',
  fill: 'Tap a shape to color it in.',
  shape: 'Drag to make a shape, or tap to drop one. Use Fill to color it in.',
  stamp: 'Tap the page to stamp.',
  erase: 'Rub to erase. Tap a colored shape to clear it.'
};
function setMode(m) {
  mode = m;
  document.querySelectorAll('#tools .tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  $('#sizes').hidden = m === 'fill';
  $('#shapePicker').hidden = m !== 'shape';
  $('#stampPicker').hidden = m !== 'stamp';
  $('#hint').textContent = HINTS[m];
  if (m !== 'erase') paintMode = m;
  $('#stage').className = 'mode-' + m;
  showCursor(false);
  if (m === 'erase') { $('#nowName').textContent = 'Eraser'; $('#nowSwatch').style.setProperty('--c', '#fff'); }
  else if (m === 'rainbow') { $('#nowName').textContent = 'Rainbow'; $('#nowSwatch').style.setProperty('--c', 'conic-gradient(#e8333a, #ffd93b, #2f9e44, #2d6fe0, #7b4bd6, #e8333a)'); }
  else showColor();
}
document.querySelectorAll('#tools .tool').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('#sizes .tool').forEach(b => b.onclick = () => {
  size = +b.dataset.size;
  document.querySelectorAll('#sizes .tool').forEach(x => x.setAttribute('aria-pressed', x === b));
});
function showColor() {
  const c = COLORS.find(x => x[1] === color);
  $('#nowSwatch').style.setProperty('--c', color);
  $('#nowName').textContent = c ? c[0] : '';
}
function renderCrayons() {
  const box = $('#crayons');
  COLORS.forEach(([name, hex]) => {
    const b = document.createElement('button');
    b.className = 'crayon' + (hex === '#ffffff' ? ' white' : ''); b.type = 'button'; b.style.setProperty('--c', hex);
    b.setAttribute('aria-label', name); b.title = name;
    b.setAttribute('aria-pressed', hex === color);
    b.innerHTML = '<span class="tip"></span><span class="body"></span>';
    b.onclick = () => {
      color = hex;
      box.querySelectorAll('.crayon').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (mode === 'erase' || mode === 'rainbow') setMode(mode === 'rainbow' ? 'draw' : paintMode === 'rainbow' ? 'draw' : paintMode); else showColor();
    };
    box.appendChild(b);
  });
}
function iconSVG(inner) { return `<svg viewBox="-56 -56 112 112" aria-hidden="true">${inner}</svg>`; }
function renderPickers() {
  const sp = $('#shapePicker');
  Object.keys(SHAPE_NAMES).forEach(t => {
    const m = t === 'line' ? { type: t, x1: -44, y1: 36, x2: 44, y2: -36 } : { type: t, x1: -44, y1: -44, x2: 44, y2: 44 };
    const b = document.createElement('button');
    b.className = 'pick'; b.type = 'button'; b.title = SHAPE_NAMES[t];
    b.setAttribute('aria-label', SHAPE_NAMES[t]); b.setAttribute('aria-pressed', t === shapeType);
    b.innerHTML = iconSVG(`<path d="${ptsD(shapeOutline(m), t !== 'line')}"/>`);
    b.onclick = () => { shapeType = t; sp.querySelectorAll('.pick').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    sp.appendChild(b);
  });
  const tp = $('#stampPicker');
  Object.entries(STAMPS).forEach(([t, st]) => {
    const b = document.createElement('button');
    b.className = 'pick'; b.type = 'button'; b.title = st.name;
    b.setAttribute('aria-label', st.name); b.setAttribute('aria-pressed', t === stampType);
    b.innerHTML = iconSVG(`<path d="${st.main}"${st.nz ? ' fill-rule="nonzero"' : ''}/>` + (st.ln ? `<path class="pl" d="${st.ln}"/>` : ''));
    b.onclick = () => { stampType = t; tp.querySelectorAll('.pick').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    tp.appendChild(b);
  });
}

/* ---------- save & print ---------- */
function savePicture() {
  const svg = $('#stage svg').cloneNode(true);
  svg.querySelectorAll('.ecursor').forEach(c => c.remove());
  svg.setAttribute('xmlns', NS);
  svg.setAttribute('width', 1200); svg.setAttribute('height', 1200);
  const style = document.createElementNS(NS, 'style');
  style.textContent = [...document.styleSheets[0].cssRules].filter(r => r.selectorText && r.selectorText.includes('.art-svg')).map(r => r.cssText).join('\n');
  svg.insertBefore(style, svg.firstChild);
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1200;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 1200, 1200);
    ctx.drawImage(img, 0, 0, 1200, 1200); URL.revokeObjectURL(url);
    cv.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = current.title.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  };
  img.src = url;
}

$('#backBtn').onclick = showGallery;
$('#prevBtn').onclick = () => step(-1);
$('#nextBtn').onclick = () => step(1);
$('#undoBtn').onclick = undo;
$('#saveBtn').onclick = savePicture;
$('#printBtn').onclick = () => window.print();
document.addEventListener('keydown', e => {
  if ($('#editor').hidden) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') showGallery();
  else if (e.key === 'ArrowRight' && !e.target.closest('.chip')) step(1);
  else if (e.key === 'ArrowLeft' && !e.target.closest('.chip')) step(-1);
});
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && (!current || current.id !== id || $('#editor').hidden)) open(id, true);
  else if (!id && !$('#editor').hidden) showGallery();
});

renderChips(); renderCrayons(); renderPickers(); setMode('draw');
const startId = location.hash.slice(1);
if (startId && DATA.pictures.some(p => p.id === startId)) open(startId, true); else renderPics();
</script>
</body>
