<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richard's Rail Sales - Sales and Math on the Rails</title>
<style>
  :root {
    --k:#000; --b:#0000aa; --g:#00aa00; --n:#aa5500; --l:#aaaaaa; --d:#555555;
    --B:#5555ff; --G:#55ff55; --C:#55ffff; --R:#ff5555; --M:#ff55ff; --Y:#ffff55; --W:#ffffff;
    --mono: "Courier New", Courier, "Lucida Console", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #000;
    color: var(--W);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.4;
  }
  a { color: var(--C); }
  a:hover { color: var(--Y); }
  :focus-visible { outline: 3px solid var(--Y); outline-offset: 2px; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 14px 14px 40px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 12px; font-size: 16px; }
  .snd {
    font: inherit; font-size: 16px; color: var(--Y); background: #000; cursor: pointer;
    border: 2px solid var(--W); padding: 6px 14px; min-height: 44px;
  }
  .snd:hover, .snd:focus-visible { background: var(--W); color: #000; outline: none; }
  .snd[aria-pressed="true"] { color: var(--G); }
  .snd[aria-pressed="true"]:hover, .snd[aria-pressed="true"]:focus-visible { color: #006600; }

  .frame { border: 4px solid var(--W); box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--B); background: #000; }
  .screen { position: relative; border-bottom: 4px solid var(--W); }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; background: #000; }

  #hud {
    display: flex; flex-wrap: wrap; gap: 4px 22px;
    padding: 8px 18px; font-size: 15px;
    border-bottom: 2px dotted var(--d);
  }
  #hud[hidden] { display: none; }
  #hud .lbl { color: var(--l); }
  #hud .low { color: var(--R); }

  #text { padding: 16px 18px 12px; outline: none; }
  #text p { margin: 0 0 .75em; max-width: 64ch; }
  h1.title {
    margin: 4px 0 6px; font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: .05em;
    color: var(--Y); text-shadow: 4px 4px 0 var(--R), 8px 8px 0 var(--B);
  }
  h2 { margin: 0 0 .6em; font-size: 20px; letter-spacing: .04em; color: var(--Y); }
  .sub { color: var(--C); margin-top: .9em !important; }
  .gold { color: var(--Y); }
  .good { color: var(--G); }
  .bad  { color: var(--R); }
  .hint { color: var(--C); }
  .q    { color: var(--W); background: var(--b); padding: 6px 10px; }
  .fx   { font-size: 16px; }
  .fx span { margin-right: 18px; }
  .board { white-space: pre-wrap; border: 2px solid var(--d); padding: 8px 12px; max-width: 46ch; }
  .steps { margin: 0 0 .75em; padding-left: 1.6em; max-width: 64ch; }
  .steps li { margin: .45em 0; }

  #choices { padding: 0 10px 18px; }
  .choice {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; color: var(--W); background: transparent;
    border: 0; padding: 8px 8px; margin: 2px 0; min-height: 44px;
  }
  .choice .n { color: var(--Y); }
  .choice:hover, .choice:focus-visible { background: var(--W); color: #000; outline: none; }
  .choice:hover .n, .choice:focus-visible .n { color: #aa0000; }

  .foot { margin-top: 18px; font-size: 14px; color: var(--l); max-width: 64ch; }

  @media (max-width: 520px) {
    body { font-size: 16px; }
    #text { padding: 12px 12px 8px; }
    #choices { padding: 0 4px 14px; }
    #hud { padding: 8px 12px; font-size: 13px; }
  }

  .who { color: var(--C); }
  .who::after { content: ":"; }
</style>
</head>
<body>
<div class="wrap">
  <p class="top"><a href="https://jaxtechnology.github.io/">Back to Jax Technology</a>
    <button id="snd" class="snd" type="button" aria-pressed="false">Sound: Off</button></p>

  <div class="frame">
    <div class="screen"><canvas id="screen" width="320" height="160" aria-hidden="true"></canvas></div>

  </div>

  <p class="foot">Richard's Rail Sales is a classroom game about sales skills and math. The railroad scenes are for fun, and the numbers are simplified for the game. Click a choice, or press its number key. Press M to turn sound on or off. The music and sounds are made right in your browser.</p>
</div>

    newMission(4);
    info({ scene: 'time', pose: 'stand', title: 'MISSION 5: RIGHT ON TIME',
      body: [say('Customers care about <b class="gold">when</b> their cargo arrives. In this game, our trains travel about <b class="gold">350 miles a day</b>. (The distances are rounded.)'),
             '<p class="board">DAYS = distance / speed\nPromise only what you can deliver!</p>'],
      next: function () { M.k = 0; M.days = null; M.hint = 0; m5Route(); } });
  }
  function m5Route() {
    var r = ROUTES[M.k];
    var ch = [1, 2, 3, 4].map(function (d) {
      return { label: d + (d === 1 ? ' day' : ' days'), run: function () {
        var ok = d === r[2]; M.days = r[2];
        if (ok) sfx('correct'); else { M.mistakes++; sfx('wrong'); }
        render({ scene: 'time', pose: ok ? 'cheer' : 'stand', title: ok ? 'CORRECT!' : 'NOT QUITE',
          body: [say(r[0] + ' is about ' + commas(r[1]) + ' miles. ' + commas(r[1]) + ' / 350 = ' + (r[1] / 350) + '. So the trip takes <b class="gold">' + r[2] + (r[2] === 1 ? ' day' : ' days') + '</b>.')],
          choices: [{ label: 'Continue', run: function () { M.k++; M.hint = 0; M.days = null; if (M.k >= ROUTES.length) m5Promise(); else m5Route(); } }] });
      } };
    });
    ch.push(hintBtn(m5Route));
    render({ scene: 'time', pose: 'stand', title: 'HOW LONG WILL IT TAKE? (' + (M.k + 1) + ' OF ' + ROUTES.length + ')',
      body: [say('Route: <b class="gold">' + r[0] + '</b>, about ' + commas(r[1]) + ' miles. The train goes 350 miles a day. How many days will it take?'),
             hintLine(['Divide the distance by 350.', 'If it does not divide evenly, round up to the next day.', 'The answer is ' + r[2] + (r[2] === 1 ? ' day.' : ' days.')])],
      choices: ch });
  }
  function m5Promise() {
    M.days = null;
    quizSeq('time', 'KEEP YOUR PROMISES', [
      { q: 'A customer needs toys in Chicago within 4 days. The trip from Jacksonville takes 3 days. What do you say?', ok: 'Yes, it will arrive in 3 days', bad: ['Maybe, we will see', 'It will take 1 day', 'No, that is impossible'],
        right: 'Right! You can keep that promise, so say it clearly.', wrong: 'Say "Yes, it will arrive in 3 days." The trip fits the deadline, so be clear and confident.' },
      { q: 'A customer needs a delivery to Chicago in 2 days, but the trip takes 3. What should you do?', ok: 'Tell the truth and offer the 3-day train or another option', bad: ['Promise 2 days to win the sale', 'Say nothing and hope they do not notice', 'Blame the train'],
        right: 'Correct! Honesty wins trust. Offer what you CAN do.', wrong: 'Tell the truth and offer the 3-day train or another option. A false promise would cost you the customer\'s trust.' },
      { q: 'A snowstorm delays the train by 1 day. What should you do?', ok: 'Call the customer right away with the new arrival day', bad: ['Wait and hope they do not notice', 'Tell them it is still on time', 'Hide until it arrives'],
        right: 'Yes! Customers can plan around bad news if they hear it early.', wrong: 'Call the customer right away with the new day. Customers can plan around bad news, but not around surprises.' }
    ], finishMission);
  }

  /* =========================================================
     MISSION 6: MAKE THE DEAL
     ========================================================= */
  var DEALS = [
    { who: 'Sunny Orchard', bucks: 3000,
      intro: 'Sunny Orchard needs to ship <b class="gold">24,000 gallons of orange juice</b> from Jacksonville to Atlanta (350 miles). It has to arrive <b class="gold">by tomorrow</b>. A tank car holds 12,000 gallons and costs 1,500 Rail Bucks. Our trains go 350 miles a day.',
      steps: [
        { q: 'Which railcar should you choose?', ok: 'Tank car', bad: ['Boxcar', 'Flatcar', 'Hopper car'], right: 'Yes, juice is a liquid, so a tank car is perfect.', wrong: 'A tank car. Juice is a liquid.' },
        { q: 'How many cars do they need?', ok: '2 cars', bad: ['1 car', '3 cars', '4 cars'], right: '24,000 / 12,000 = 2 cars. A perfect fit.', wrong: '2 cars. 24,000 / 12,000 = 2.' },
        { q: 'What is the total price?', ok: '3,000 Rail Bucks', bad: ['1,500 Rail Bucks', '4,500 Rail Bucks', '6,000 Rail Bucks'], right: '2 cars x 1,500 = 3,000 Rail Bucks.', wrong: '3,000 Rail Bucks. 2 cars x 1,500 each.' },
        { q: 'What do you promise about delivery?', ok: 'It will arrive tomorrow, in 1 day', bad: ['It will arrive in 3 days', 'It will arrive in 5 minutes', 'I cannot say'], right: '350 miles at 350 miles a day is 1 day, so you can keep that promise.', wrong: 'It will arrive in 1 day. 350 miles at 350 miles a day is 1 day.' }
      ] },
    { who: 'Frosty Creamery', bucks: 6000,
      intro: 'Frosty Creamery has <b class="gold">3 cars</b> of ice cream to send from Jacksonville to Chicago (1,050 miles). A refrigerated car costs 2,000 Rail Bucks. The owner says, "I need it there in <b class="gold">2 days</b>!"',
      steps: [
        { q: 'Which railcar should you choose?', ok: 'Refrigerated car', bad: ['Boxcar', 'Flatcar', 'Hopper car'], right: 'Right, ice cream has to stay frozen.', wrong: 'A refrigerated car. Ice cream must stay frozen.' },
        { q: 'What is the total price for 3 cars?', ok: '6,000 Rail Bucks', bad: ['2,000 Rail Bucks', '5,000 Rail Bucks', '8,000 Rail Bucks'], right: '3 x 2,000 = 6,000 Rail Bucks.', wrong: '6,000 Rail Bucks. 3 x 2,000.' },
        { q: 'How many days will the trip really take?', ok: '3 days', bad: ['1 day', '2 days', '5 days'], right: '1,050 / 350 = 3 days.', wrong: '3 days. 1,050 / 350 = 3.' },
        { q: 'The owner wants it in 2 days. What do you say?', ok: 'The trip takes 3 days. I can offer the 3-day train.', bad: ['Sure, 2 days!', 'Maybe 2 days if we are lucky', 'Do not worry about it'], right: 'Honest and helpful. The customer can plan around 3 days.', wrong: 'Tell the truth: the trip takes 3 days, and offer that train. A false promise would break trust.' }
      ] },
    { who: 'Big Box Toys', bucks: 5400,
      intro: 'Big Box Toys has <b class="gold">2,400 boxes</b> of toys to ship from Atlanta to Chicago (700 miles). A boxcar holds 800 boxes and costs 1,800 Rail Bucks. They need delivery in <b class="gold">2 days</b>.',
      steps: [
        { q: 'How many boxcars do they need?', ok: '3 cars', bad: ['2 cars', '4 cars', '5 cars'], right: '2,400 / 800 = 3 cars.', wrong: '3 cars. 2,400 / 800 = 3.' },
        { q: 'What is the total price?', ok: '5,400 Rail Bucks', bad: ['3,600 Rail Bucks', '7,200 Rail Bucks', '1,800 Rail Bucks'], right: '3 x 1,800 = 5,400 Rail Bucks.', wrong: '5,400 Rail Bucks. 3 x 1,800.' },
        { q: 'What do you promise about delivery?', ok: 'Yes, it will take 2 days. I can promise that.', bad: ['It will take 5 days', 'It will take 1 day', 'We cannot ship toys'], right: '700 / 350 = 2 days, so you can keep that promise.', wrong: 'Yes, 2 days. 700 miles at 350 miles a day is 2 days.' }
      ] }
  ];

  function m6() {
    newMission(5);
    M.bucks = 0;
    info({ scene: 'deal', pose: 'clip', title: 'MISSION 6: MAKE THE DEAL',
      body: [say('Time to put it all together! Three customers are waiting. For each one, you will pick the right railcar, count the cars, work out the price, and make a promise you can keep.'),
             '<p class="board">LISTEN, then MATCH the car,\nCOUNT the cars, QUOTE the price,\nCHECK the schedule, KEEP your promise.</p>'],
      next: function () { M.d = 0; m6Deal(); } });
  }
  function m6Deal() {
    var dl = DEALS[M.d];
    info({ scene: 'deal', pose: 'clip', title: 'DEAL ' + (M.d + 1) + ' OF 3: ' + dl.who.toUpperCase(), body: [say(dl.intro)], btn: 'Start the deal', next: function () { M.s = 0; m6Step(); } });
  }
  function m6Step() {
    var dl = DEALS[M.d];
    if (M.s >= dl.steps.length) {
      M.bucks += dl.bucks; sfx('coin'); sfx('whistle', 0.3);
      var last = M.d === DEALS.length - 1;
      render({ scene: 'deal', pose: 'cheer', title: 'DEAL CLOSED!',
        body: ['<p class="good">' + dl.who + ' signs the order!</p>', say('That is ' + commas(dl.bucks) + ' Rail Bucks of business, and a happy customer who will come back.'), '<p class="board">TOTAL SO FAR: ' + commas(M.bucks) + ' RAIL BUCKS</p>'],
        choices: [{ label: last ? 'Finish the mission' : 'Next customer', run: function () { if (last) finishMission(); else { M.d++; m6Deal(); } } }] });
      return;
    }
    var st = dl.steps[M.s];
    askOne({ scene: 'deal', title: 'DEAL ' + (M.d + 1) + ': ' + dl.who.toUpperCase() + ' (STEP ' + (M.s + 1) + ' OF ' + dl.steps.length + ')',
             lead: '', q: st.q, opts: [{ t: st.ok, ok: true }].concat(st.bad.map(function (b) { return { t: b, ok: false }; })), right: st.right, wrong: st.wrong },
           function () { M.s++; m6Step(); });
  }

  /* =========================================================
     HUB, NOTEBOOK, GRADUATION, TITLE
     ========================================================= */
  var RUNNERS = [m1, m2, m3, m4, m5, m6];

  function hub() {
    M = null; PROG.started = true;
    var all = PROG.done.every(Boolean), any = PROG.done.some(Boolean);
    var ch = MISSIONS.map(function (m, i) {
      return { label: '<b>' + (i + 1) + '. ' + m.name + '</b> - ' + m.blurb + (PROG.done[i] ? ' <span class="gold">' + starText(PROG.stars[i]) + '</span>' : ''), run: RUNNERS[i] };
    });
    ch.push({ label: 'Open my sales notebook', run: notebook });
    if (all) ch.push({ label: '<span class="gold">Graduation day!</span>', run: finale });
    render({ scene: 'hub', pose: 'stand', title: 'THE RAIL OFFICE',
      body: [say(any ? 'Welcome back to the office! Pick a mission. Any order works, but the order shown is the best way to learn.' : 'Welcome to the rail office! I am Richard. Pick a mission to start. Mission 1 is a great place to begin.'),
             '<span class="hint">Finish all 6 missions to graduate. Stars: 3 for few mistakes, so take your time.</span>'],
      choices: ch });
  }

  function notebook() {
    var any = PROG.done.some(Boolean);
    render({ scene: 'hub', pose: 'stand', title: 'SALES NOTEBOOK',
      body: [say(any ? 'Here is everything you have learned so far:' : 'Your notebook is empty. Finish a mission and I will write down what you learned.'),
             any ? '<p class="board">' + NOTES.filter(function (n, i) { return PROG.done[i]; }).join('\n\n') + '</p>' : ''],
      choices: [{ label: 'Back to the office', run: hub }, { label: 'Erase my progress', run: erase }] });
  }
  function erase() {
    render({ scene: 'hub', pose: 'stand', title: 'ERASE PROGRESS?',
      body: [say('This clears all your stars and your notebook. Are you sure?')],
      choices: [{ label: 'Keep my progress', run: notebook },
                { label: 'Yes, erase everything', run: function () { PROG.stars = [0, 0, 0, 0, 0, 0]; PROG.done = [false, false, false, false, false, false]; saveP(); hub(); } }] });
  }

  function finale() {
    var tot = totalStars(), rank = tot >= 16 ? 'SALES CHAMPION' : tot >= 12 ? 'ACCOUNT MANAGER' : 'JUNIOR SALES REP';
    sfx('pass'); sfx('whistle', 0.4);
    render({ scene: 'win', title: 'GRADUATION DAY!',
      body: [say('You finished every mission! You listened, matched, counted, priced, and kept your promises, just like a real sales rep does.'),
             '<p class="board">CERTIFICATE OF SALES SKILL\nMISSIONS: 6 OF 6\nSTARS: ' + tot + ' OF 18\nRANK: <span class="gold">' + rank + '</span></p>',
             '<span class="hint">Want more stars? Go back and retry any mission for a better score.</span>'],
      choices: [{ label: 'Back to the office', run: hub }] });
  }

  function title() {
    render({ scene: 'title', big: 'RICHARD\'S RAIL SALES',
      body: ['<p class="hint" style="margin-top:0">All aboard for a career in sales!</p>',
             'Meet Richard, who works at the railroad company CSX selling space on freight trains. Help him match customers with the right railcars, do the math, and make fair deals. Richard explains everything, and hints are always one press away.'],
      choices: [
        { label: 'Enter the office', run: hub },
        { label: 'How to play', run: function () {
            render({ scene: 'hub', pose: 'stand', title: 'HOW TO PLAY',
              body: [say('It is easy! Here is how my office works:'),
                     '<p class="board">Click a choice, or press its number key.\nStuck? Choose "Ask Richard for a hint" as many times as you like.\nEarn up to 3 stars per mission. Fewer mistakes means more stars.\nYour progress saves on this computer.\nPress M to turn sound on or off.</p>'],
              choices: [{ label: 'Back', run: title }] });
          } }
      ] });
  }

  /* ---------- sound button ---------- */
  var sndBtn = $('snd');
  function sndLabel() {
    sndBtn.textContent = 'Sound: ' + (Snd.on ? 'On' : 'Off');
    sndBtn.setAttribute('aria-pressed', Snd.on ? 'true' : 'false');
  }
  try { Snd.on = localStorage.getItem('roadToLawSound') === '1'; } catch (e) { /* ignore */ }
  sndLabel();
  sndBtn.addEventListener('click', function () { Snd.set(!Snd.on); });
  function unlockAudio() {
    if (Snd.on && !Snd.ctx && Snd.init()) { Snd.ctx.resume(); Snd.cur = null; Snd.play(Snd.want); }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', function () {
    if (!Snd.ctx) return;
    if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume();
  });

  loadP();
  title();
})();
</script>
</body>
</html>
