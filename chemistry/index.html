<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yonas' Lab - A Chemistry Adventure</title>
<style>
  :root {
    --k:#000; --b:#0000aa; --g:#00aa00; --n:#aa5500; --l:#aaaaaa; --d:#555555;
    --B:#5555ff; --G:#55ff55; --C:#55ffff; --R:#ff5555; --M:#ff55ff; --Y:#ffff55; --W:#ffffff;
    --mono: "Courier New", Courier, "Lucida Console", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #000;
    color: var(--W);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.4;
  }
  a { color: var(--C); }
  a:hover { color: var(--Y); }
  :focus-visible { outline: 3px solid var(--Y); outline-offset: 2px; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 14px 14px 40px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 12px; font-size: 16px; }
  .snd {
    font: inherit; font-size: 16px; color: var(--Y); background: #000; cursor: pointer;
    border: 2px solid var(--W); padding: 6px 14px; min-height: 44px;
  }
  .snd:hover, .snd:focus-visible { background: var(--W); color: #000; outline: none; }
  .snd[aria-pressed="true"] { color: var(--G); }
  .snd[aria-pressed="true"]:hover, .snd[aria-pressed="true"]:focus-visible { color: #006600; }

  .frame { border: 4px solid var(--W); box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--B); background: #000; }
  .screen { position: relative; border-bottom: 4px solid var(--W); }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; background: #000; }

  #hud {
    display: flex; flex-wrap: wrap; gap: 4px 22px;
    padding: 8px 18px; font-size: 15px;
    border-bottom: 2px dotted var(--d);
  }
  #hud[hidden] { display: none; }
  #hud .lbl { color: var(--l); }
  #hud .low { color: var(--R); }

  #text { padding: 16px 18px 12px; outline: none; }
  #text p { margin: 0 0 .75em; max-width: 64ch; }
  h1.title {
    margin: 4px 0 6px; font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: .05em;
    color: var(--Y); text-shadow: 4px 4px 0 var(--R), 8px 8px 0 var(--B);
  }
  h2 { margin: 0 0 .6em; font-size: 20px; letter-spacing: .04em; color: var(--Y); }
  .sub { color: var(--C); margin-top: .9em !important; }
  .gold { color: var(--Y); }
  .good { color: var(--G); }
  .bad  { color: var(--R); }
  .hint { color: var(--C); }
  .q    { color: var(--W); background: var(--b); padding: 6px 10px; }
  .fx   { font-size: 16px; }
  .fx span { margin-right: 18px; }
  .board { white-space: pre-wrap; border: 2px solid var(--d); padding: 8px 12px; max-width: 46ch; }
  .steps { margin: 0 0 .75em; padding-left: 1.6em; max-width: 64ch; }
  .steps li { margin: .45em 0; }

  #choices { padding: 0 10px 18px; }
  .choice {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; color: var(--W); background: transparent;
    border: 0; padding: 8px 8px; margin: 2px 0; min-height: 44px;
  }
  .choice .n { color: var(--Y); }
  .choice:hover, .choice:focus-visible { background: var(--W); color: #000; outline: none; }
  .choice:hover .n, .choice:focus-visible .n { color: #aa0000; }

  .foot { margin-top: 18px; font-size: 14px; color: var(--l); max-width: 64ch; }

  @media (max-width: 520px) {
    body { font-size: 16px; }
    #text { padding: 12px 12px 8px; }
    #choices { padding: 0 4px 14px; }
    #hud { padding: 8px 12px; font-size: 13px; }
  }

  .who { color: var(--C); }
  .who::after { content: ":"; }
</style>
</head>
<body>
<div class="wrap">
  <p class="top"><a href="https://jaxtechnology.github.io/">Back to Jax Technology</a>
    <button id="snd" class="snd" type="button" aria-pressed="false">Sound: Off</button></p>

  <div class="frame">
    <div class="screen"><canvas id="screen" width="320" height="160" aria-hidden="true"></canvas></div>
    <div id="hud" hidden></div>
    <div id="text" tabindex="-1" aria-live="polite"></div>
    <div id="choices" role="group" aria-label="Your choices"></div>
  </div>

  <p class="foot">Yonas' Lab is a classroom game about middle school chemistry. Click a choice, or press its number key. Press M to turn sound on or off. The music and sounds are made right in your browser.</p>
</div>

<noscript><p style="padding:20px">This game needs JavaScript turned on.</p></noscript>

  function yonas(x, y, pose, s) {
    var g = YONAS[pose] || YONAS.stand;
    for (var j = 0; j < g.length; j++) {
      var row = g[j], i = 0;
      while (i < row.length) {
        var ch = row.charAt(i);
        if (ch === '.') { i++; continue; }
        var k = i; while (k < row.length && row.charAt(k) === ch) k++;
        R(x + i * s, y + j * s, (k - i) * s, s, YONAS_PAL[ch]);
        i = k;
      }
    }
  }

  var DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001',

  function num(x, y, n, c) {
    String(n).split('').forEach(function (d, k) {
      var g = DIG[Number(d)];
      for (var i = 0; i < 15; i++) if (g.charAt(i) === '1') R(x + k * 4 + (i % 3), y + Math.floor(i / 3), 1, 1, c);
    });
  }

    for (var i = 4; i < 10; i++) { var w = 14 * (i + 1) / 10; R(x - w / 2, y + i, w, 1, col); }

    o = o || {};

            choices: [{ label: 'Continue', run: function () { M.hint = 0; M.pressure = 0.1; m7Quiz(M7_MASS, function () { m7Quiz(M7_VOCAB, m7Done); }); } }] });
        } else if (o.k === 'low') {
          M.gas = 0.55; M.pressure = 0.25;
          render({ scene: 'machine', pose: 'stand', title: 'NOT ENOUGH',
            body: [say('Only a little gas formed, so the balloon is only half full. No dents this time. Try a bigger amount!')],
            choices: [{ label: 'Try again', run: function () { M.pressure = 0.1; m7Amount(); } }] });
        } else {
          M.pressure = 1;
          m7Bonk('The tank is sealed, so the gas had nowhere to go. Too much gas means too much pressure, and the machine bulged and dented. (In real life, never seal a reaction that makes gas.)',
                 function () { M.pressure = 0.1; m7Amount(); });
        }
      } };
    });
    ch.push(hintBtn(m7Amount));
    render({ scene: 'machine', pose: 'stand', title: 'HOW MUCH?',
      body: [say('The machine\'s tank is sealed. Gas takes up space and pushes on the walls. That push is called <b class="gold">pressure</b>, and the gauge shows it. How much baking soda will fill the balloon without overloading the tank?'),
             '<p class="board">DENTS: ' + M.dents + ' OF 3</p>',
             hintLine(['The red zone on the gauge means danger.', 'One scoop makes very little gas, and eight makes a huge amount of gas.', 'Choose the middle amount: not too little and not too much.'])],
      choices: ch });
  }

  function m7Quiz(list, next) {
    var k = 0;
    (function step() {
      if (k >= list.length) return next();
      var q = list[k++], opts = shuffle([{ t: q.ok, ok: true }].concat(q.bad.map(function (b) { return { t: b, ok: false }; })));
      render({ scene: 'machine', pose: 'stand', title: 'MACHINE CHECK',
        body: [say('The machine asks a question. Answer carefully!'), '<p class="q">' + q.q + '</p>', '<p class="board">DENTS: ' + M.dents + ' OF 3</p>'],
        choices: opts.map(function (o) {
          return { label: o.t, run: function () {
            if (o.ok) { sfx('correct', 0.08); render({ scene: 'machine', pose: 'cheer', title: 'CORRECT!', body: ['<p class="good">CORRECT!</p>', say(q.right)], choices: [{ label: 'Continue', run: step }] }); }
            else m7Bonk(q.wrong, step);
          } };
        }) });
    })();
  }

  function m7Done() {
    M.mistakes = [0, 2, 4][M.dents];
    PROG.dented = false;
    finishMission();
  }

  /* =========================================================
     HUB, NOTEBOOK, GRADUATION, TITLE
     ========================================================= */
  var RUNNERS = [m1, m2, m3, m4, m5, m6, m7];

  function hub() {
    M = null; PROG.started = true;
    var all = PROG.done.every(Boolean), any = PROG.done.some(Boolean);
    var ch = MISSIONS.map(function (m, i) {
      return { label: '<b>' + (i + 1) + '. ' + m.name + '</b> - ' + m.blurb + (PROG.done[i] ? ' <span class="gold">' + starText(PROG.stars[i]) + '</span>' : ''), run: RUNNERS[i] };
    });
    ch.push({ label: 'Open my lab notebook', run: notebook });
    if (all) ch.push({ label: '<span class="gold">Graduation day!</span>', run: finale });
    render({ scene: 'hub', pose: 'stand', title: 'YONAS\' LAB',
      body: [say(any ? 'Welcome back to the lab! Pick a mission. Any order works, but the order shown is the best way to learn.' : 'Welcome to my lab! I am Yonas. Pick a mission to start. Mission 1 is a great place to begin.'),
             PROG.dented ? say('My Reaction Machine is still dented from last time. Want to fix it up with Mission 7?') : '',
             '<span class="hint">Finish all 7 missions to graduate. Stars: 3 for few mistakes, so take your time.</span>'],
      choices: ch });
  }

  function notebook() {
    var any = PROG.done.some(Boolean);
    render({ scene: 'hub', pose: 'stand', title: 'LAB NOTEBOOK',
      body: [say(any ? 'Here is everything you have learned so far:' : 'Your notebook is empty. Finish a mission and I will write down what you learned.'),
             any ? '<p class="board">' + NOTES.filter(function (n, i) { return PROG.done[i]; }).join('\n\n') + '</p>' : ''],
      choices: [{ label: 'Back to the lab', run: hub }, { label: 'Erase my progress', run: erase }] });
  }
  function erase() {
    render({ scene: 'hub', pose: 'stand', title: 'ERASE PROGRESS?',
      body: [say('This clears all your stars and your notebook. Are you sure?')],
      choices: [{ label: 'Keep my progress', run: notebook },
                { label: 'Yes, erase everything', run: function () { PROG.stars = [0, 0, 0, 0, 0, 0, 0]; PROG.done = [false, false, false, false, false, false, false]; PROG.dented = false; saveP(); hub(); } }] });
  }

  function finale() {
    var tot = totalStars(), rank = tot >= 19 ? 'MASTER CHEMIST' : tot >= 14 ? 'LAB TECHNICIAN' : 'JUNIOR CHEMIST';
    sfx('pass');
    render({ scene: 'win', title: 'GRADUATION DAY!',
      body: [say('You finished every mission in my lab. I could not be prouder!'),
             '<p class="board">CERTIFICATE OF LAB SKILL\nMISSIONS: 7 OF 7\nSTARS: ' + tot + ' OF 21\nRANK: <span class="gold">' + rank + '</span></p>',
             '<span class="hint">Want more stars? Go back and retry any mission for a better score.</span>'],
      choices: [{ label: 'Back to the lab', run: hub }] });
  }

  function title() {
    render({ scene: 'title', big: 'YONAS\' LAB',
      body: ['<p class="hint" style="margin-top:0">A Chemistry Adventure</p>',
             'Meet Yonas, a wild-haired chemist with a lab full of surprises. Complete 7 short missions about atoms, matter, mixtures, reactions, and more. Yonas explains everything, and hints are always one press away.'],
      choices: [
        { label: 'Enter the lab', run: hub },
        { label: 'How to play', run: function () {
            render({ scene: 'hub', pose: 'stand', title: 'HOW TO PLAY',
              body: [say('It is easy! Here is how my lab works:'),
                     '<p class="board">Click a choice, or press its number key.\nStuck? Choose "Ask Yonas for a hint" as many times as you like.\nEarn up to 3 stars per mission. Fewer mistakes means more stars.\nYour progress saves on this computer.\nPress M to turn sound on or off.</p>'],
              choices: [{ label: 'Back', run: title }] });
          } }
      ] });
  }

  /* ---------- sound button ---------- */
  var sndBtn = $('snd');
  function sndLabel() {
    sndBtn.textContent = 'Sound: ' + (Snd.on ? 'On' : 'Off');
    sndBtn.setAttribute('aria-pressed', Snd.on ? 'true' : 'false');
  }
  try { Snd.on = localStorage.getItem('roadToLawSound') === '1'; } catch (e) { /* ignore */ }
  sndLabel();
  sndBtn.addEventListener('click', function () { Snd.set(!Snd.on); });
  function unlockAudio() {
    if (Snd.on && !Snd.ctx && Snd.init()) { Snd.ctx.resume(); Snd.cur = null; Snd.play(Snd.want); }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', function () {
    if (!Snd.ctx) return;
    if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume();
  });

  loadP();
  title();
})();
</script>
</body>
</html>
