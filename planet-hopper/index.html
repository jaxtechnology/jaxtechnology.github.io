<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Hopper - A Trip Across the Solar System</title>
<style>
  :root {
    --k:#000; --b:#0000aa; --g:#00aa00; --n:#aa5500; --l:#aaaaaa; --d:#555555;
    --B:#5555ff; --G:#55ff55; --C:#55ffff; --R:#ff5555; --M:#ff55ff; --Y:#ffff55; --W:#ffffff;
    --mono: "Courier New", Courier, "Lucida Console", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #000;
    color: var(--W);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.4;
  }
  a { color: var(--C); }
  a:hover { color: var(--Y); }
  :focus-visible { outline: 3px solid var(--Y); outline-offset: 2px; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 14px 14px 40px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 12px; font-size: 16px; }
  .snd {
    font: inherit; font-size: 16px; color: var(--Y); background: #000; cursor: pointer;
    border: 2px solid var(--W); padding: 6px 14px; min-height: 44px;
  }
  .snd:hover, .snd:focus-visible { background: var(--W); color: #000; outline: none; }
  .snd[aria-pressed="true"] { color: var(--G); }
  .snd[aria-pressed="true"]:hover, .snd[aria-pressed="true"]:focus-visible { color: #006600; }

  .frame { border: 4px solid var(--W); box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--B); background: #000; }
  .screen { position: relative; border-bottom: 4px solid var(--W); }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; background: #000; }

  #hud {
    display: flex; flex-wrap: wrap; gap: 4px 22px;
    padding: 8px 18px; font-size: 15px;
    border-bottom: 2px dotted var(--d);
  }
  #hud[hidden] { display: none; }
  #hud .lbl { color: var(--l); }
  #hud .low { color: var(--R); }

  #text { padding: 16px 18px 12px; outline: none; }
  #text p { margin: 0 0 .75em; max-width: 64ch; }
  h1.title {
    margin: 4px 0 6px; font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: .05em;
    color: var(--Y); text-shadow: 4px 4px 0 var(--R), 8px 8px 0 var(--B);
  }
  h2 { margin: 0 0 .6em; font-size: 20px; letter-spacing: .04em; color: var(--Y); }
  .sub { color: var(--C); margin-top: .9em !important; }
  .gold { color: var(--Y); }
  .good { color: var(--G); }
  .bad  { color: var(--R); }
  .hint { color: var(--C); }
  .q    { color: var(--W); background: var(--b); padding: 6px 10px; }
  .fx   { font-size: 16px; }
  .fx span { margin-right: 18px; }
  .board { white-space: pre-wrap; border: 2px solid var(--d); padding: 8px 12px; max-width: 46ch; }
  .steps { margin: 0 0 .75em; padding-left: 1.6em; max-width: 64ch; }
  .steps li { margin: .45em 0; }

  #choices { padding: 0 10px 18px; }
  .choice {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; color: var(--W); background: transparent;
    border: 0; padding: 8px 8px; margin: 2px 0; min-height: 44px;
  }
  .choice .n { color: var(--Y); }
  .choice:hover, .choice:focus-visible { background: var(--W); color: #000; outline: none; }
  .choice:hover .n, .choice:focus-visible .n { color: #aa0000; }

  .foot { margin-top: 18px; font-size: 14px; color: var(--l); max-width: 64ch; }

  @media (max-width: 520px) {
    body { font-size: 16px; }
    #text { padding: 12px 12px 8px; }
    #choices { padding: 0 4px 14px; }
    #hud { padding: 8px 12px; font-size: 13px; }
  }

  .ctlrow { display: flex; gap: 10px; padding: 0 8px 8px; }
  .ctl {
    font: inherit; color: var(--W); background: var(--b); cursor: pointer;
    border: 2px solid var(--W); min-height: 56px; min-width: 72px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .ctl.big { flex: 1; }
  .ctl.on, .ctl:active { background: var(--W); color: #000; }
</style>
</head>
<body>
<div class="wrap">
  <p class="top"><a href="https://jaxtechnology.github.io/">Back to Jax Technology</a>
    <button id="snd" class="snd" type="button" aria-pressed="false">Sound: Off</button></p>

  <div class="frame">
    <div class="screen"><canvas id="screen" width="320" height="160" aria-hidden="true"></canvas></div>
    <div id="hud" hidden></div>
    <div id="text" tabindex="-1" aria-live="polite"></div>
    <div id="choices" role="group" aria-label="Your choices"></div>
  </div>

  <p class="foot">Planet Hopper is a classroom game about the solar system. Click a choice, or press its number key. Press M to turn sound on or off. The music and sounds are made right in your browser.</p>
</div>

<noscript><p style="padding:20px">This game needs JavaScript turned on.</p></noscript>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* =========================================================
     DRAWING TOOLKIT  (320 x 160 canvas, 16-color EGA palette)
     ========================================================= */
  var cv = $('screen');
  var ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var P = { k:'#000000', b:'#0000aa', g:'#00aa00', c:'#00aaaa', r:'#aa0000', m:'#aa00aa', n:'#aa5500', l:'#aaaaaa',
            d:'#555555', B:'#5555ff', G:'#55ff55', C:'#55ffff', R:'#ff5555', M:'#ff55ff', Y:'#ffff55', W:'#ffffff' };

  function R(x, y, w, h, c) {
    ctx.fillStyle = P[c] || c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
  }
  function circle(cx, cy, r, c) {
    for (var y = -r; y <= r; y++) {
      var w = Math.floor(Math.sqrt(r * r - y * y));
      R(cx - w, cy + y, 2 * w + 1, 1, c);
    }
  }
  function tri(cx, topY, half, h, c) {
    for (var i = 0; i < h; i++) { var w = half * 2 * (i + 1) / h; R(cx - w / 2, topY + i, w, 1, c); }
  }
  function sky(h, cols) {
    var bh = Math.ceil(h / cols.length);
    cols.forEach(function (c, i) { R(0, i * bh, 320, bh, c); });
  }
  function lcg(seed) {
    var s = seed >>> 0;
    return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }

  var t = 0; // animation tick

  var STARS = (function () {
    var r = lcg(7), a = [];
    for (var i = 0; i < 70; i++) a.push([Math.floor(r() * 320), Math.floor(r() * 110), Math.floor(r() * 7)]);
    return a;
  })();
  function stars() {
    STARS.forEach(function (s) { if ((t + s[2]) % 9 !== 0) R(s[0], s[1], 1, 1, s[2] % 3 === 0 ? 'Y' : 'W'); });
  }
  function cloud(x, y) { R(x, y + 8, 32, 4, 'W'); R(x + 4, y + 4, 24, 8, 'W'); R(x + 10, y, 14, 10, 'W'); }


  /* =========================================================
     SPRITES + SCENES  (Planet Hopper)
     ========================================================= */
  function ball(cx, cy, r, cols, shade) {
    for (var y = -r; y <= r; y++) {
      var w = Math.floor(Math.sqrt(r * r - y * y));
      var ci = Math.min(cols.length - 1, Math.floor((y + r) / (2 * r + 1) * cols.length));
      R(cx - w, cy + y, 2 * w + 1, 1, cols[ci]);
      if (shade) { var sx = Math.floor(w * 0.45); R(cx + sx, cy + y, Math.max(1, w - sx + 1), 1, shade); }
    }
  }
  function ring(cx, cy, a, b, col, front) {
    for (var x = -a; x <= a; x++) {
      var yy = b * Math.sqrt(1 - (x * x) / (a * a));
      R(cx + x, cy + (front ? yy : -yy), 1, 2, col);
    }
  }
  var SHADE = 'rgba(0,0,0,0.32)';

  // The Sparrow: our little ship, flying to the right.
  function ship(x, y, o) {
    o = o || {};
    if (o.flame !== false) {
      var fl = (t % 2) ? 8 : 5;
      R(x - fl, y + 5, fl, 4, 'Y'); R(x - fl - 3, y + 6, 3, 2, 'R');
    }
    R(x + 2, y, 6, 3, 'R'); R(x + 2, y + 11, 6, 3, 'R');
    R(x, y + 3, 20, 8, 'W'); R(x + 6, y + 3, 2, 8, 'R');
    R(x + 20, y + 4, 3, 6, 'R'); R(x + 23, y + 5, 2, 4, 'R'); R(x + 25, y + 6, 1, 2, 'R');
    circle(x + 13, y + 7, 2, 'C');
    R(x, y + 3, 20, 1, 'l'); R(x, y + 10, 20, 1, 'l');
  }

  // Little landing module. (x, y) is the bottom center of the legs.
  function lander(x, y, thrust) {
    R(x - 6, y - 11, 12, 8, 'l'); R(x - 6, y - 11, 12, 1, 'W');
    circle(x, y - 8, 2, 'C');
    R(x - 8, y - 3, 16, 1, 'd');
    R(x - 8, y - 3, 2, 4, 'd'); R(x + 6, y - 3, 2, 4, 'd');
    R(x - 9, y, 4, 1, 'd'); R(x + 5, y, 4, 1, 'd');
    if (thrust) { R(x - 2, y - 2, 4, 5 + (t % 2) * 4, 'Y'); R(x - 1, y + 3, 2, 4, 'R'); }
  }

  function rocketV(x, by, flame) {
    R(x - 12, by - 22, 6, 22, 'R'); R(x + 6, by - 22, 6, 22, 'R');
    R(x - 6, by - 62, 12, 56, 'W'); R(x + 2, by - 62, 4, 56, 'l');
    R(x - 6, by - 6, 12, 6, 'd');
    tri(x, by - 80, 6, 18, 'R');
    R(x - 6, by - 30, 12, 4, 'R');
    circle(x, by - 46, 3, 'C');
    if (flame) { R(x - 4, by, 8, 10 + (t % 2) * 6, 'Y'); R(x - 2, by + 8, 4, 8, 'R'); }
  }

  var NODES = [[50,92],[68,68],[98,102],[130,78],[168,94],[208,68],[246,98],[284,76]];
  function routePos(f) {
    f = Math.max(0, Math.min(7, f));
    var i = Math.min(6, Math.floor(f)), k = f - i;
    return [NODES[i][0] + (NODES[i + 1][0] - NODES[i][0]) * k, NODES[i][1] + (NODES[i + 1][1] - NODES[i][1]) * k];
  }

  var view = { name: 'title' };
  var LD = null; // lander minigame state

  function mapF() {
    if (view.loop) return ((t % 110) / 110) * 7;
    if (view.travel) {
      var el = reduce ? 1e9 : (performance.now() - view.travel.start);
      var p = Math.min(1, el / 1600);
      var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      view.moving = p < 1;
      return view.travel.from + (view.travel.to - view.travel.from) * e;
    }
    view.moving = false;
    return view.at || 0;
  }

  var ROCKS = (function () {
    var r = lcg(11), a = [];
    for (var i = 0; i < 18; i++) a.push({ x: Math.floor(r() * 360), y: 8 + Math.floor(r() * 144), r: 2 + Math.floor(r() * 7), s: 0.6 + r() * 2.2 });
    return a;
  })();

  function bob() { return reduce ? 0 : Math.round(Math.sin(t / 4) * 4); }
  function space() { R(0, 0, 320, 160, 'k'); stars(); }

  var SCENES = {
    title: function () {
      space();
      ball(60, 178, 96, ['b']);
      circle(36, 118, 12, 'g'); circle(56, 112, 9, 'g'); circle(92, 128, 14, 'g'); circle(24, 146, 10, 'g'); circle(70, 136, 8, 'g');
      R(20, 126, 18, 3, 'W'); R(60, 104, 14, 3, 'W'); R(82, 142, 20, 3, 'W'); R(110, 118, 12, 3, 'W');
      ball(268, 38, 10, ['l'], SHADE); R(262, 34, 4, 2, 'd'); R(270, 42, 3, 2, 'd');
      ship(((t * 3) % 400) - 40, 64 + bob());
    },
    launch: function () {
      R(0, 0, 320, 160, 'k'); sky(100, ['k', 'k', 'b']); stars();
      R(0, 128, 320, 32, 'd'); R(0, 128, 320, 3, 'l');
      R(196, 52, 8, 76, 'l'); R(228, 60, 4, 68, 'l');
      for (var i = 0; i < 6; i++) R(196, 58 + i * 12, 36, 2, 'l');
      rocketV(150, 128, false);
      var k = reduce ? 3 : Math.floor(t / 4) % 4;
      for (var j = 0; j < 3; j++) { R(20 + j * 18, 20, 14, 14, 'k'); R(21 + j * 18, 21, 12, 12, k > j ? (j === 2 ? 'G' : 'Y') : 'd'); }
    },
    liftoff: function () {
      R(0, 0, 320, 160, 'k'); sky(100, ['k', 'k', 'b']); stars();
      R(0, 128, 320, 32, 'd'); R(0, 128, 320, 3, 'l');
      var up = reduce ? 40 : (t * 5) % 150;
      rocketV(150, 128 - up, true);
      for (var i = 0; i < 6; i++) { circle(120 + i * 16 + ((t + i) % 3), 130 + (i % 2) * 4, 5 + (up < 40 ? 3 : 0), (i % 2) ? 'l' : 'W'); }
    },
    moon: function () {
      space();
      ball(250, 36, 15, ['b'], SHADE); circle(246, 34, 5, 'g'); circle(254, 42, 3, 'g');
      R(0, 112, 320, 48, 'l'); R(0, 112, 320, 2, 'W');
      [[30,126,36],[120,140,50],[220,122,40],[270,146,30]].forEach(function (c) { R(c[0], c[1], c[2], 4, 'd'); R(c[0] + 3, c[1] + 4, c[2] - 6, 2, 'd'); });
      lander(150, 118, false);
      R(204, 90, 1, 28, 'W'); R(205, 90, 12, 8, 'R'); R(205, 94, 12, 2, 'W');
    },
    mars: function () {
      sky(104, ['n', 'n', 'R']); circle(262, 30, 5, 'Y');
      tri(244, 52, 78, 52, '#8a1500'); tri(90, 78, 52, 26, 'n');
      R(0, 104, 320, 56, 'r'); R(0, 104, 320, 2, 'R');
      R(40, 130, 10, 6, 'd'); R(190, 138, 14, 8, 'd'); R(262, 126, 8, 5, 'k'); R(150, 144, 9, 5, 'd');
      lander(120, 114, false);
    },
    belt: function () {
      space();
      ROCKS.forEach(function (k) {
        var x = (((k.x - (reduce ? 0 : t) * k.s) % 360) + 360) % 360 - 20;
        circle(x, k.y, k.r, 'd'); circle(x - 1, k.y - 1, Math.max(1, k.r - 2), 'l'); R(x + 1, k.y + 1, 1, 1, 'k');
      });
      ship(120, 68 + bob());
    },
    jupiter: function () {
      space();
      ball(236, 84, 86, ['n', 'Y', 'n', 'W', 'n', 'Y', 'n', 'R', 'n', 'Y', 'n'], SHADE);
      circle(212, 108, 9, 'R'); circle(212, 108, 5, 'n'); circle(212, 108, 2, 'R');
      ship(40, 70 + bob());
    },
    saturn: function () {
      space();
      ring(200, 84, 94, 18, 'l', false); ring(200, 84, 78, 14, 'Y', false);
      ball(200, 84, 40, ['Y', 'n', 'Y', 'l', 'Y', 'n'], SHADE);
      ring(200, 84, 94, 18, 'l', true); ring(200, 84, 78, 14, 'Y', true);
      ship(24, 66 + bob());
    },
    uranus: function () {
      space();
      ball(210, 84, 40, ['C', 'c', 'C', 'C'], SHADE);
      for (var y = -66; y <= 66; y++) { var xx = 13 * Math.sqrt(1 - (y * y) / 4356); R(210 + xx, 84 + y, 2, 1, 'W'); R(210 - xx, 84 + y, 2, 1, 'W'); }
      ship(36, 70 + bob());
    },
    neptune: function () {
      space();
      ball(214, 84, 42, ['b', 'B', 'b', 'b', 'B', 'b'], SHADE);
      R(188, 70, 28, 2, 'W'); R(222, 96, 24, 2, 'W'); R(200, 112, 18, 2, 'W'); circle(198, 98, 6, 'k');
      ball(80, 34, 6, ['l'], SHADE);
      ship(32, 76 + bob());
    },
    win: function () {
      space();
      ball(252, 118, 64, ['b', 'B', 'b'], SHADE);
      var fxs = [60, 250, 110, 190], fys = [40, 36, 74, 30], cc = ['Y', 'R', 'C', 'M'];
      for (var b = 0; b < 4; b++) {
        var ph = (t + b * 5) % 18;
        if (ph < 12 || reduce) {
          var r = (reduce ? 8 : ph) * 3;
          for (var k = 0; k < 12; k++) { var a = k / 12 * Math.PI * 2; R(fxs[b] + Math.cos(a) * r, fys[b] + Math.sin(a) * r, 2, 2, cc[(b + k) % 4]); }
        }
      }
      for (var i = 0; i < 36; i++) R((i * 37) % 320, reduce ? (i * 53) % 160 : ((i * 53) + t * 3) % 160, 2, 2, cc[i % 4]);
      ship(140, 80 + bob());
    },
    dead: function () {
      R(0, 0, 320, 160, 'k');
      STARS.forEach(function (s, i) { if (i % 2) R(s[0], s[1], 1, 1, 'd'); });
      ball(250, 44, 26, ['d'], 'rgba(0,0,0,0.4)');
      var sx = 110 + (reduce ? 0 : Math.round(Math.sin(t / 12) * 8));
      ship(sx, 76, { flame: false });
      if (t % 8 < 4) R(sx + 9, 73, 2, 2, 'R');
    },
    lander: function () {
      var L = LD, moon = !L || L.world === 'moon';
      if (moon) {
        space();
        ball(268, 34, 12, ['b'], SHADE); circle(264, 32, 4, 'g');
        R(0, 140, 320, 20, 'l'); R(0, 140, 320, 2, 'W');
        [[20,148,30],[110,152,44],[200,146,36],[270,150,40]].forEach(function (c) { R(c[0], c[1], c[2], 3, 'd'); });
      } else {
        sky(110, ['n', 'n', 'R']); circle(280, 24, 4, 'Y');
        tri(230, 70, 80, 70, '#8a1500'); tri(70, 102, 50, 38, 'n');
        R(0, 140, 320, 20, 'r'); R(0, 140, 320, 2, 'R'); R(40, 150, 10, 5, 'd'); R(230, 148, 14, 6, 'd');
      }
      if (!L) { lander(160, 100, false); return; }
      R(L.pad - 26, 139, 52, 3, 'W');
      R(L.pad - 26, 137, 3, 2, (t % 6 < 3) ? 'G' : 'Y'); R(L.pad + 23, 137, 3, 2, (t % 6 < 3) ? 'Y' : 'G');
      var h = Math.max(0, Math.min(100, L.vy * 100 / 60));
      R(6, 20, 8, 100, 'd'); R(6, 120 - h, 8, h, L.vy <= 22 ? 'G' : 'R'); R(3, 120 - 22 * 100 / 60, 14, 1, 'Y');
      R(306, 20, 8, 100, 'd'); R(306, 120 - L.fuel, 8, L.fuel, 'C');
      lander(Math.round(L.x), Math.round(L.y), L.thrusting);
    },
    map: function () {
      space();
      circle(-4, 86, 34, 'R'); circle(-4, 86, 28, 'Y');
      for (var i = 0; i < 7; i++) {
        var a = NODES[i], b = NODES[i + 1], steps = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / 5);
        for (var s = 0; s <= steps; s++) R(a[0] + (b[0] - a[0]) * s / steps - 1, a[1] + (b[1] - a[1]) * s / steps - 1, 2, 2, 'd');
      }
      var f = mapF(), cur = Math.round(f);
      var rad = [5, 4, 5, 8, 10, 7, 6, 6];
      for (var n = 0; n < 8; n++) {
        var mc = n < cur ? 'G' : (n === cur ? ((t % 6 < 3) ? 'W' : 'R') : 'd');
        circle(NODES[n][0], NODES[n][1], rad[n] + 3, mc); circle(NODES[n][0], NODES[n][1], rad[n] + 2, 'k');
      }
      ball(NODES[0][0], NODES[0][1], 5, ['b']); R(NODES[0][0] - 2, NODES[0][1] - 2, 3, 2, 'g');
      ball(NODES[1][0], NODES[1][1], 4, ['l']);
      ball(NODES[2][0], NODES[2][1], 5, ['R']);
      [[-6,-3],[5,-5],[-3,5],[7,3],[0,-7],[-7,4],[3,7]].forEach(function (d, k) { R(NODES[3][0] + d[0], NODES[3][1] + d[1], 2 + (k % 2), 2, k % 2 ? 'l' : 'd'); });
      ball(NODES[4][0], NODES[4][1], 10, ['n', 'Y', 'n', 'W', 'n']);
      ring(NODES[5][0], NODES[5][1], 11, 3, 'l', false); ball(NODES[5][0], NODES[5][1], 7, ['Y', 'n', 'Y']); ring(NODES[5][0], NODES[5][1], 11, 3, 'l', true);
      ball(NODES[6][0], NODES[6][1], 6, ['C', 'c']);
      ball(NODES[7][0], NODES[7][1], 6, ['b', 'B', 'b']);
      var pos = routePos(f);
      ship(pos[0] - 13, pos[1] - 28, { flame: !!(view.loop || view.moving) });
    }
  };

  function draw() { (SCENES[view.name] || SCENES.title)(view); }
  draw();
  if (!reduce) setInterval(function () { t++; if (!(LD && !LD.done)) draw(); }, 130);

  /* LANDER START */
  function stepLander(L, dt, inp) {
    var th = !!inp.thrust && L.fuel > 0;
    L.vy += (L.g - (th ? 34 : 0)) * dt;
    L.y += L.vy * dt;
    if (th) L.fuel = Math.max(0, L.fuel - 14 * dt);
    L.x = Math.max(8, Math.min(312, L.x + inp.dir * 45 * dt));
    L.thrusting = th;
    if (L.y < 12) { L.y = 12; if (L.vy < 0) L.vy = 0; }
    if (L.y >= 140) {
      L.y = 140; L.done = true; L.speed = L.vy;
      L.onPad = Math.abs(L.x - L.pad) <= 26;
      L.ok = L.vy <= 22 && L.onPad;
    }
    return L;
  }
  /* LANDER END */

  /* AUDIO START */

      title: 'STOP ' + (i + 1) + ' OF 8',
      body: ['<b class="gold">' + STOPS[i].name.toUpperCase() + '</b>', STOPS[i].teaser,

  }

  /* =========================================================
     LANDER MINIGAME
     ========================================================= */
  var KEYS = { thrust: false, left: false, right: false };
  var PTR = { thrust: false, left: false, right: false };

  function landInput() {
    return { thrust: KEYS.thrust || PTR.thrust,
             dir: ((KEYS.right || PTR.right) ? 1 : 0) - ((KEYS.left || PTR.left) ? 1 : 0) };
  }
  function stopLander() {
    if (LD && LD.raf) cancelAnimationFrame(LD.raf);
    LD = null;
    KEYS.thrust = KEYS.left = KEYS.right = false;
    PTR.thrust = PTR.left = PTR.right = false;
    Snd.thruster(false);
  }

  function landerIntro(world, next) {
    var moon = world === 'moon';
    render({ scene: world, title: (moon ? 'LAND ON THE MOON' : 'LAND ON MARS'),
      body: [moon ? 'The Moon\'s gravity is weak, so a lander falls slowly. This is the easiest landing on the trail.'
                  : 'Mars has more gravity than the Moon, so the lander falls faster and needs more thrust. It is trickier!',
             'Do you want to fly the lander yourself?'],
      choices: [
        { label: 'Land by hand', run: function () { startLander(world, next); } },
        { label: 'Auto-land (safe, but uses 8 fuel)', run: function () {
            var h = apply({ fuel: -8 });
            info({ scene: world, title: 'AUTO-LAND', body: ['The computer sets the Sparrow down gently. Safe, but it burns extra fuel.', h], next: next });
          } }
      ] });
  }

  function startLander(world, next) {
    var g = world === 'moon' ? 7 : 16;
    var x = 40 + rnd(240), pad = 50 + rnd(220);
    while (Math.abs(pad - x) < 50) pad = 50 + rnd(220);
    LD = { world: world, g: g, x: x, y: 22, vy: 0, fuel: 100, pad: pad, done: false, thrusting: false, next: next, last: performance.now(), raf: 0 };
    render({ scene: 'lander', title: world === 'moon' ? 'MOON LANDING' : 'MARS LANDING',
      body: ['Hold <b class="gold">SPACE</b> (or the THRUST button) to fire the engine. Use the <b class="gold">left and right arrow keys</b> (or buttons) to move sideways.',
             'Land on the pad, with the speed bar <b class="gold">below the yellow line</b>. Gravity pulls you down, so use short bursts to slow down!',
             '<p id="tele" class="hint" aria-hidden="true"></p>'],
      choices: [] });
    mountControls();
    LD.raf = requestAnimationFrame(landLoop);
  }

  function mountControls() {
    choicesEl.innerHTML =
      '<div class="ctlrow">' +
      '<button type="button" class="ctl" data-k="left" aria-label="Move left">&#9664;</button>' +
      '<button type="button" class="ctl big" data-k="thrust">THRUST</button>' +
      '<button type="button" class="ctl" data-k="right" aria-label="Move right">&#9654;</button>' +
      '</div>' +
      '<button type="button" class="choice" id="autoland"><span class="n">&gt;</span> Auto-land instead (uses 8 fuel)</button>';
    Array.prototype.forEach.call(choicesEl.querySelectorAll('.ctl'), function (b) {
      var k = b.getAttribute('data-k');
      function down(e) { e.preventDefault(); PTR[k] = true; b.classList.add('on'); }
      function up() { PTR[k] = false; b.classList.remove('on'); }
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });
    $('autoland').addEventListener('click', function () {
      var l = LD; if (!l) return;
      var nx = l.next, w = l.world;
      stopLander();
      var h = apply({ fuel: -8 });
      info({ scene: w, title: 'AUTO-LAND', body: ['The computer sets the Sparrow down gently. Safe, but it burns extra fuel.', h], next: nx });
    });
  }

  var teleLast = '';
  function teleUpdate() {
    var el = $('tele'); if (!el || !LD) return;
    var s = 'SPEED ' + Math.max(0, Math.round(LD.vy)) + ' (safe: 22 or less)   FUEL ' + Math.round(LD.fuel);
    if (s !== teleLast) { el.textContent = s; teleLast = s; }
  }

  function landLoop(now) {
    if (!LD || LD.done) return;
    var dt = Math.min(0.05, (now - LD.last) / 1000);
    LD.last = now;
    stepLander(LD, dt, landInput());
    Snd.thruster(LD.thrusting);
    draw(); teleUpdate();
    if (LD.done) { finishLander(); return; }
    LD.raf = requestAnimationFrame(landLoop);
  }

  document.addEventListener('keydown', function (e) {
    if (!LD || LD.done) return;
    var k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { KEYS.thrust = true; e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { KEYS.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { KEYS.right = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') KEYS.thrust = false;
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') KEYS.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') KEYS.right = false;
  });
  document.addEventListener('pointerup', function () { PTR.thrust = PTR.left = PTR.right = false; });

  function finishLander() {
    var L = LD, moon = L.world === 'moon', next = L.next, world = L.world;
    var ok = L.ok, onPad = L.onPad, fuelLeft = L.fuel;
    stopLander();
    var fact = moon ? 'On the Moon, weak gravity makes landing gentler.' : 'Mars has stronger gravity and a thin atmosphere, so landing there is hard.';
    if (ok) {
      sfx('pass');
      S.landed++;
      var h = apply({ morale: 10, fuel: Math.floor(fuelLeft / 12) });
      info({ scene: world, title: 'TOUCHDOWN!', body: ['<span class="good">A perfect landing on the pad!</span> The crew cheers.', '<span class="hint">' + fact + '</span>', h], next: next });
    } else {
      sfx('crash');
      var h2 = apply({ fuel: -10, oxygen: -6, morale: -8 });
      var why = onPad ? 'You came in too fast, and the landing was rough.' : 'You missed the pad, and the lander tipped over.';
      info({ scene: world, title: 'ROUGH LANDING', body: ['<span class="bad">' + why + '</span> The crew makes repairs, and the ship is okay.', '<span class="hint">' + fact + '</span>', h2], next: next });
    }
  }

  function maybeEvent(cont) {
    if (S.events < 3 && Math.random() < 0.55) {
      var pool = EVENTS.filter(function (e) { return S.used.indexOf(e.id) < 0; });
      if (pool.length) {
        var e = pool[rnd(pool.length)];
        S.used.push(e.id); S.events++;
        return e.run(cont);
      }
    }

  }

      choices: [
        { label: 'Start the mission', run: begin },
        { label: 'Learn the trail first', run: function () { recap(title); } }
      ] });
  }

  /* ---------- sound button ---------- */
  var sndBtn = $('snd');
  function sndLabel() {
    sndBtn.textContent = 'Sound: ' + (Snd.on ? 'On' : 'Off');
    sndBtn.setAttribute('aria-pressed', Snd.on ? 'true' : 'false');
  }
  try { Snd.on = localStorage.getItem('roadToLawSound') === '1'; } catch (e) { /* ignore */ }
  sndLabel();
  sndBtn.addEventListener('click', function () { Snd.set(!Snd.on); });
  function unlockAudio() {
    if (Snd.on && !Snd.ctx && Snd.init()) { Snd.ctx.resume(); Snd.cur = null; Snd.play(Snd.want); }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);
  document.addEventListener('visibilitychange', function () {
    if (!Snd.ctx) return;
    if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume();
  });

  title();
})();
</script>
</body>
</html>
